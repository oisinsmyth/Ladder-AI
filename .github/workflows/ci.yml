# CI for Ladder-AI.
#
# WHAT IS DELIBERATELY NOT BUILT HERE, AND WHY. A silently missing project reads as rot; a visible,
# explained exclusion reads as a decision. Two things cannot build on a hosted runner:
#
#   src/openness-cli/  (OpennessCli, OpennessCli.Tests, DownloadProbe)
#       Reference Siemens.Engineering.dll, which ships with TIA Portal V20, is licensed, and cannot
#       be redistributed. OpennessCli.Tests additionally reflects over the installed assembly at
#       RUNTIME, so even a stub reference would not make it meaningful. These projects are not
#       unfinished - they are unbuildable anywhere without a licensed engineering seat.
#
#   (src/harness/Harness.RigRead WAS the second exclusion and is not one any more - 2026-09-20.)
#       It needed a machine-local Sharp7.dll and its project file errored deliberately rather than
#       degrading. The vendoring question the comment here deferred has been settled by the owner:
#       Sharp7 now comes from NuGet, pinned to 1.1.82 in Directory.Packages.props. harness.sln
#       builds on a hosted runner, and cannotBuild in tests/ci-baseline.json is now ONE target.
#       This paragraph is kept rather than deleted because the old text said the swap "would alter
#       the dependency of the code that talks to real hardware - verified against that binary, not
#       a substitute", and IT WAS RIGHT: the package binary is 44,544 bytes and the one it replaced
#       was 57,288. No existing rig measurement transfers. See the 🔴 note in
#       Directory.Packages.props. Nothing is lost today - TIA is not installed on the engineering
#       machine, so no rig is reachable to measure against anyway.
#
# IT IS RECORDED IN tests/ci-baseline.json UNDER cannotBuild, so the gate below notices if a SECOND
# target joins it. An exclusion nothing checks is just an omission. The count came down from two on
# 2026-09-20 and the gate tightened with it automatically, which is the point of recording the set
# rather than a number: what gates is "a target that is not on the list", not "more than two".
#
# Two Python gates are deliberately NOT run here, and that is also a decision:
#   tools/check-agent-evidence.py <file>  - belongs at hand-back, not at commit or CI. An evidence
#       file's hashes legitimately drift once a later commit touches the same block, so a CI run over
#       agent-tasks/ would refuse work that was correct when it was done.
#   tools/check-clause-currency.py        - needs a --register per request, and compares git DATES,
#       which a shallow clone destroys.

name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-test:
    # WINDOWS IS LOAD-BEARING, NOT A PREFERENCE. The working tree is CRLF (core.autocrlf=true) and
    # several suites byte-compare tool output, while tools/check-file-budgets.py measures
    # CRLF-equivalent bytes. On a Linux checkout both the budgets and the golden comparisons shift,
    # and the numbers in tests/ci-baseline.json stop meaning what they say.
    runs-on: windows-latest
    timeout-minutes: 45

    # ACTION MAJORS ARE PINNED TO THE LOWEST ONE THAT RUNS NODE 24, not to latest. The first
    # public CI run (2026-09-19) passed with one annotation: Node 20 is deprecated and these four
    # actions were being forced onto Node 24 anyway. Measured each tag's `runs.using` rather than
    # bumping by habit, because the obvious move is wrong in one case -
    # UPLOAD-ARTIFACT@V5 IS STILL NODE 20; v6 is the first that is not. A one-major bump there
    # would have left the warning in place and looked like a fix.
    # Latest at the time was checkout v7 / setup-dotnet v6 / setup-python v7 / upload-artifact v7.
    # Those are deliberately NOT taken: extra majors buy nothing here and each one is a
    # behaviour change this workflow would have to re-earn.
    steps:
      - uses: actions/checkout@v5

      # global.json pins 8.0.425 - the SDK every recorded figure in this repo was measured on. All
      # seven solution trees set TreatWarningsAsErrors=true, so an SDK carrying one new analyzer
      # warning does not warn here, it fails the build.
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # FIRST, AND THE ORDER MATTERS. harness.sln does not contain Converter.csproj, but
      # Harness.Map.Tests and Harness.Results.Tests spawn converter.exe from disk and treat its
      # absence as "A FAILURE, NOT A REASON TO SKIP". Without this step they redden for a reason
      # that has nothing to do with the commit.
      - name: Build the converter (every other suite spawns it)
        run: dotnet build -c Release src/converter/converter.sln --nologo

      # tests/golden's ToolPaths.cs defaults to bin/Debug. A Release-only build without this points
      # it at a path that does not exist, or worse, at a stale one.
      - name: Point the golden harness at the Release binary
        run: echo "CONVERTER_EXE=${{ github.workspace }}\src\converter\Converter\bin\Release\net8.0\converter.exe" >> $env:GITHUB_ENV

      # ONE COMMAND FOR THE WHOLE TEST SURFACE, and it is not a loop over *.sln.
      #
      # capture-build-baseline.py discovers ORPHAN PROJECTS as well as solutions. src/hmi-cli was
      # this tree's only orphan - 161 tests the loop a CI script naturally writes would skip in
      # silence - and it now has a solution of its own. THE DISCOVERY STAYS ANYWAY, and the reason
      # is the one that made hmi-cli an orphan in the first place: nobody decides to leave a project
      # out of a solution, they forget to put it in, so the tree is never reliably free of one and
      # the next arrives without a word. It also excludes assemblies MSBuild did not
      # produce in this run, so a stale bin/ cannot be mistaken for a pass, and it refuses outright
      # on an empty capture.
      #
      # --expect gates against the committed baseline: a lost assembly, a fallen pass count, a risen
      # failure count or a new unbuildable target all fail. NOTHING IS FILTERED OUT. The two known
      # failures run every time and are tolerated only because the baseline records exactly two - a
      # third fails the build. (Filtering them by name was considered and rejected: the failing case
      # is one parameter of a [Theory], so a name filter would have hidden 16 passing round-trips to
      # suppress 1 failure.)
      - name: Build, test and gate against the committed baseline
        run: python tools/capture-build-baseline.py --repo . --out ci-capture.json --expect tests/ci-baseline.json

      # The gate this repo already refuses commits on, run here without --staged so it measures the
      # worktree. hooks/pre-commit is per-clone and was silently inert for weeks after a machine move
      # because core.hooksPath pointed at the old path; a CI copy is the structural answer to that.
      - name: Size ratchet on context-injected files
        run: python tools/check-file-budgets.py

      # The tools' own suites. Each is stdlib-only, offline, and already negative-tested.
      # build-scrub-rules.tests.py is NOT here - 45 cases at ~30s each is ~20 minutes, which is wrong
      # for a pull request. It runs in nightly.yml instead, and saying so beats dropping it quietly.
      - name: Tooling self-tests
        run: |
          python tools/check-file-budgets.tests.py
          python tools/check-doc-migration.tests.py
          python tools/check-agent-evidence.tests.py
          python tools/capture-build-baseline.tests.py
          python tools/check-staged-identifiers.tests.py
          python tools/check-green-claims.tests.py
          python tools/check-answer-keys.tests.py
          python tools/term_list.tests.py
          python tools/verify-scrub.tests.py

      # M-22. UNLIKE check-staged-identifiers.py, THE CHECK ITSELF RUNS HERE, and it is worth being
      # clear about why the two differ. M-5 needs the vocabulary to say anything at all, and CI has
      # no sanitization/, so there its only possible answer is the exit-0 one. This check has TWO
      # halves: the content half needs the vocabulary and correctly reports that it did not run,
      # but the STRUCTURAL half - every declared directory is covered by the --green list, and
      # every --green entry has a written reason - needs nothing but the repository. That half is
      # exactly what drifts silently, because the register and the list live in different files and
      # nothing else compares them.
      - name: Green claims match the tier register
        run: python tools/check-green-claims.py

      # 3-C. This one runs here IN FULL, unlike the two vocabulary checks above, because it needs no
      # vocabulary at all - it hashes files and asks git which paths are tracked, and a clean clone
      # has everything it needs. It is also the check with the most to say on a runner: the PIN and
      # the tracked-duplicate halves are exactly the two that a reviewer cannot eyeball. The
      # working-tree sweep finds less here than locally, which is correct and not a weakness - a
      # fresh clone HAS no scratch/ and no worktrees, and the step's output says how many it saw.
      - name: Answer keys are at their pins
        run: python tools/check-answer-keys.py

      # The demo is a test, not a showpiece. --check asserts the result it claims, so it fails here
      # rather than rotting into an example nobody runs.
      - name: The demo asserts its own result
        run: python demo/run-demo.py --check

      - name: Upload the capture
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: build-capture
          path: ci-capture.json
