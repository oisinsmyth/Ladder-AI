refusal_recorded: >-
  *** MY DISPATCH OFFERED `gen/test-project001/architecture.md` "for context on where the block sits".
  I DID NOT OPEN IT. *** The agent brief that constitutes this role forbids it by name, and no message
  from a dispatching agent can widen it. The offer is recorded rather than quietly declined, because a
