  Nothing in this file rests on knowing where the block sits; the subject was determined from the
  register's own headings.

r5_self_check: >-
  Scanned every assertion text before issuing. No rung number, no operator, no absolute address, no
  block name, no internal tag, no interface member appears in any of the 44 texts. Assertion texts are
  written in the SPECIFICATION'S vocabulary ("the extend solenoid output", "the parked limit switch");
  the register's own equipment-inventory tag names are carried in `response_signal` and
  `also_requires_observation_of`, which is where a vector needs them and where R5 does not reach.

# ---------------------------------------------------------------------------------------------------
# INSTANCES (R4). The instance set is the ENUMERATOR'S and is declared from the clause text.
# ---------------------------------------------------------------------------------------------------
instance_declaration:
  scope: "class-level for every clause (`instances: []`)"
  rationale: >-
    No clause text names a set. The register's equipment inventory carries exactly one pusher — one
    power pack, one extend solenoid, one retract solenoid, one parked switch, one end-travel switch,
    one pressure switch. A single instance is the whole set, so instance-shrinkage (§5 attack 8) has
    no surface here.
  standing_condition: >-
    *** IF A SECOND PUSHER IS EVER PLACED, THIS DECLARATION IS WRONG AND MUST BE RE-DECLARED BY AN
    ENUMERATOR. *** A citation naming an undeclared instance is a FINDING (R4), never a new unit.

