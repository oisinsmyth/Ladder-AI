buckets_not_assigned_here: >-
  OUT-OF-SCOPE and UNTESTABLE-ON-RIG belong to whoever signs off the architecture at gate 1 (§4.3) —
  never to the block's author, never to a vector's author, and not to the enumerator either. DEFERRED
  needs an owner and a date. UNCLASSIFIED is never written: it is
  enumerated - (COVERED u OUT-OF-SCOPE u DEFERRED u UNTESTABLE-ON-RIG), computed across two artifacts.
  *** ALL 44 ARE UNCLASSIFIED TODAY, BECAUSE NO CLASSIFICATION ARTIFACT EXISTS. THE GATE SHOULD FAIL
  UNTIL ONE DOES. *** Two assertions are visibly bucket-shaped and are NOT assigned by me: REQ-036 A1
  (its trigger signal does not exist) and REQ-052 A1 (it requires both limit switches true at once,
  which the machine cannot produce). Named for the signer, decided by the signer.

clauses:

  REQ-025:
    title: "Overcurrent parks the pusher"
    clause_text: "On the same overcurrent event, the pusher returns to parked."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN an overcurrent event occurs THEN the pusher returns to the parked position"
        normalised_text: "WHEN an overcurrent event occurs THEN the pusher returns to the parked position"
        id: REQ-025:c86768
        response_signal: DI12_PSH_HomeLimit
        also_requires_observation_of: "DQ7_PSH_Retract"
        bounds_depended_on: "[] — the clause states no time limit; see AMB-PSH-10"
        split_defect: "Sole assertion of the clause. Its own defect is an overcurrent response that stops the shredder and the infeed and leaves the ram wherever it stood, extended into the chamber the machine is trying to clear."

  REQ-030:
    title: "Power pack before and during movement"
    clause_text: "Any movement of the pusher requires the hydraulic power pack to be running prior to and during operation of the extend or retract solenoids."
    instances: []
    note_on_the_two_adverbs: "'prior to' and 'during' are not split. A single continuous prohibition is falsified by an early energise AND by a mid-stroke pump loss, so no defect isolates one adverb from the other. R3-adjacent: they qualify one prohibition."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER the extend solenoid output is energised while the hydraulic power pack is not running"
        normalised_text: "NEVER the extend solenoid output is energised while the hydraulic power pack is not running"
        id: REQ-030:416fcf
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI11_PSH_PowerPackRunning"
        bounds_depended_on: "[]"
        split_defect: "The power-pack interlock is applied to the retract path only, so an extend command drives the solenoid against a dead pump. A2 stays true. Split per J1 — the clause names both directions."
      - ordinal: A2
        form: Never
        text: "NEVER the retract solenoid output is energised while the hydraulic power pack is not running"
        normalised_text: "NEVER the retract solenoid output is energised while the hydraulic power pack is not running"
        id: REQ-030:2a932b
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI11_PSH_PowerPackRunning"
        bounds_depended_on: "[]"
        split_defect: "The power-pack interlock is applied to the extend path only, so a retract command drives the solenoid against a dead pump and the ram cannot be brought home. A1 stays true."

  REQ-031:
    title: "Power pack run-on"
    clause_text: "The power pack has a run-on so the hydraulic motor does not stop when transitioning from push to retract."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the pusher transitions from the push stroke to the retract stroke THEN the power pack run command remains continuously asserted across the transition"
        normalised_text: "WHEN the pusher transitions from the push stroke to the retract stroke THEN the power pack run command remains continuously asserted across the transition"
        id: REQ-031:552d25
        response_signal: DQ3_PSH_RunPowerPack
        also_requires_observation_of: "DQ6_PSH_Extend, DQ7_PSH_Retract"
        bounds_depended_on: "[] — POSITIVE CLAIM. The clause states no run-on duration; the 5 s default has no source-document number (Q-02) and is not imported as a bound, per 1.2a."
        split_defect: "Sole assertion of the clause. Its own defect is a pump command derived from whichever solenoid is currently active, so it drops for the gap between de-energising extend and energising retract and the hydraulic motor stalls in the middle of every cycle."

  REQ-032:
    title: "Pusher cycle definition"
    clause_text: "One pusher cycle: start from parked, transition to the end-travel limit, hold a short pause of approximately 2 s, then retract to parked."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN a pusher cycle is initiated with the pusher at the parked position THEN the extend solenoid output is energised"
        normalised_text: "WHEN a pusher cycle is initiated with the pusher at the parked position THEN the extend solenoid output is energised"
        id: REQ-032:e9ec63
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI12_PSH_HomeLimit"
        bounds_depended_on: "[]"
        split_defect: "No stroke is produced at all on a cycle trigger, or the retract solenoid is driven instead of the extend. A2, A3, A4 stay true — each is conditioned on a stroke that has already happened."
      - ordinal: A2
        form: When
        text: "WHEN the pusher reaches the end-travel limit during a cycle THEN the retract stroke subsequently begins"
        normalised_text: "WHEN the pusher reaches the end-travel limit during a cycle THEN the retract stroke subsequently begins"
        id: REQ-032:c9bdba
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI13_PSH_FullTravelLimit"
        bounds_depended_on: "[]"
        split_defect: "The cycle stalls at end travel and the retract stroke never begins, so the ram is left fully extended. A3 stays true — a ram that never retracts has trivially not retracted early."
      - ordinal: A3
        form: When
        text: "WHEN the pusher reaches the end-travel limit during a cycle THEN the retract stroke does not begin until at least the specified end-travel hold time has elapsed since the end-travel limit was reached"
        normalised_text: "WHEN the pusher reaches the end-travel limit during a cycle THEN the retract stroke does not begin until at least the specified end-travel hold time has elapsed since the end-travel limit was reached"
        id: REQ-032:d97f33
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI13_PSH_FullTravelLimit"
        bounds_depended_on: "[end_travel_hold_time]"
        split_defect: "The dwell is absent or the preset is under-scaled, so the ram reverses the instant it reaches end travel and the pause that lets the load fall into the shredder never happens. A2 stays true, because the ram did retract. *** THIS IS J2 — AN ARRIVAL ASSERTION CANNOT CATCH AN UNDER-SCALED PRESET; IT IS SATISFIED MORE EASILY BY ONE. ***"
      - ordinal: A4
        form: When
        text: "WHEN the pusher reaches the parked limit on the retract stroke THEN the retract solenoid output is de-energised"
        normalised_text: "WHEN the pusher reaches the parked limit on the retract stroke THEN the retract solenoid output is de-energised"
        id: REQ-032:f30398
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI12_PSH_HomeLimit"
        bounds_depended_on: "[]"
        split_defect: "The retract drive is not removed at the parked limit, so the ram is held hard against its home stop at full hydraulic pressure for as long as the logic is left in that state. A1, A2, A3 stay true."

  REQ-034:
    title: "Auto mode: cycle on hopper high"
    clause_text: "In automatic mode, a pusher cycle is triggered by hopper high level."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the hopper high-level input becomes true while the pusher mode is automatic THEN a pusher cycle is performed"
        normalised_text: "WHEN the hopper high-level input becomes true while the pusher mode is automatic THEN a pusher cycle is performed"
        id: REQ-034:60cfae
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI8_HPR_LevelHigh, DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is a hopper-high that stops the infeed and never initiates a pusher cycle, so the blockage the pusher exists to clear is never cleared mechanically. See AMB-PSH-06 — nothing here constrains REPETITION, and AMB-PSH-04 — nothing constrains the other modes."

  REQ-035:
    title: "Manual mode: HMI cycle button"
    clause_text: "In manual mode, the operator can trigger a pusher cycle with a manual cycle button on the HMI."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the HMI manual cycle command is asserted while the pusher mode is manual THEN a pusher cycle is performed"
        normalised_text: "WHEN the HMI manual cycle command is asserted while the pusher mode is manual THEN a pusher cycle is performed"
        id: REQ-035:8b1ede
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DB_Controls.PusherManualCycleCmd, DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is a manual cycle command that is not read, or is read only while the plant sequence is running, so the operator cannot exercise the ram on a stopped machine."

  REQ-036:
    title: "Manual mode: remote pushbutton"
    clause_text: "In manual mode, a pusher cycle can also be triggered by a remote-mounted pushbutton via a digital input."
    instances: []
    trigger_signal_status: "*** PROPOSED — NO TAG EXISTS. *** The register names no digital input for a remote pusher cycle button; DI16_PSH_LocalRemote is a selector with undefined semantics (Q-03, open). Enumerated regardless — see AMB-PSH-13."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the remote pusher cycle pushbutton input is asserted while the pusher mode is manual THEN a pusher cycle is performed"
        normalised_text: "WHEN the remote pusher cycle pushbutton input is asserted while the pusher mode is manual THEN a pusher cycle is performed"
        id: REQ-036:b86fdf
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "the remote pusher cycle pushbutton input (NO TAG EXISTS), DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is that only the HMI trigger is implemented and the remote button does nothing, which REQ-035's assertion cannot detect because it drives the other trigger."

  REQ-037:
    title: "Off mode: retract to home"
    clause_text: "When the pusher mode is off, the pusher retracts to the home (parked) position."
    instances: []
    ruling_applied: "Q-16, owner ruling recorded 2026-07-16, which NARROWS this clause: mid-cycle Off still retracts and parks; an idle ram off home no longer self-parks on selecting Off. Both assertions below are written against the clause AS NARROWED, and that narrowing is the register's own, not mine."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the pusher mode is selected off while a pusher cycle is in progress THEN the pusher retracts to the parked position"
        normalised_text: "WHEN the pusher mode is selected off while a pusher cycle is in progress THEN the pusher retracts to the parked position"
        id: REQ-037:eaaeb2
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI12_PSH_HomeLimit, DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "Selecting off is latched until the cycle finishes, so the ram completes a full extend-hold-retract after the operator has switched the pusher off. A2 stays true."
      - ordinal: A2
        form: Never
        text: "NEVER the pusher moves in response to the selection of off mode while it is idle and away from the parked position"
        normalised_text: "NEVER the pusher moves in response to the selection of off mode while it is idle and away from the parked position"
        id: REQ-037:b05df8
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DQ6_PSH_Extend, DI12_PSH_HomeLimit, DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "An idle ram left off home self-parks the moment off is selected — an unwarned hydraulic movement with nobody expecting it, which is exactly what Q-16's ruling removed. A1 stays true, because the mid-cycle case is a different trigger."

  REQ-038:
    title: "Hand control: jog per direction"
    clause_text: "Hand control of the pusher exists for testing, with a jog button for each direction."
    instances: []
    ruling_applied: "Q-15, owner ruling 2026-07-17 — 'Hand = Manual, this is true always'. Hand jog is a facility WITHIN manual mode, not a fourth mode, so both triggers below are scoped to manual."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the jog-extend command is asserted while the pusher mode is manual THEN the pusher moves in the extend direction"
        normalised_text: "WHEN the jog-extend command is asserted while the pusher mode is manual THEN the pusher moves in the extend direction"
        id: REQ-038:945929
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DB_Controls.PusherJogExtendCmd, DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "Only one jog direction is implemented, or the two are transposed, so the extend button does nothing while the retract button works. A2 stays true. Split per J1 — the clause names a button for EACH direction."
      - ordinal: A2
        form: When
        text: "WHEN the jog-retract command is asserted while the pusher mode is manual THEN the pusher moves in the retract direction"
        normalised_text: "WHEN the jog-retract command is asserted while the pusher mode is manual THEN the pusher moves in the retract direction"
        id: REQ-038:27614a
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DB_Controls.PusherJogRetractCmd, DB_Controls.PusherMode"
        bounds_depended_on: "[]"
        split_defect: "Only the extend jog is implemented, so a commissioning engineer can drive the ram out by hand and not back. A1 stays true."

  REQ-039:
    title: "Jog is hold-to-move"
    clause_text: "The operator must hold the jog button to move the pusher; on release it stops where it is."
    instances: []
    note_on_grain: "One assertion, not two per direction, per J1 — the clause speaks of 'the jog button' generically. An asymmetric latch on one direction still falsifies it."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER the pusher continues to move under jog after the jog command that started the movement has been released"
        normalised_text: "NEVER the pusher continues to move under jog after the jog command that started the movement has been released"
        id: REQ-039:9d8bd9
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DQ7_PSH_Retract, DB_Controls.PusherJogExtendCmd, DB_Controls.PusherJogRetractCmd"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Two defects it catches and neither of which any other assertion does: a LATCHED jog, where one press runs the ram to the limit and the operator cannot stop it part way; and an automatic return to parked on release, which is movement after release and is what 'stops WHERE IT IS' forbids."

  REQ-040:
    title: "Jog independent of shredder"
    clause_text: "Hand jogging can be done with or without the shredder running."
    instances: []
    note_on_grain: "One assertion per J1 — the clause speaks of 'hand jogging' generically and asserts the ABSENCE of an interlock, not a per-direction behaviour."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN a jog command is asserted while the shredder is not running THEN the pusher moves in the commanded direction"
        normalised_text: "WHEN a jog command is asserted while the shredder is not running THEN the pusher moves in the commanded direction"
        id: REQ-040:0b5ab9
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DQ7_PSH_Retract, DI5_SHR_RunFwdFB, DI6_SHR_RunRevFB"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is a jog interlocked on the shredder running, so the ram cannot be exercised on a stopped machine — which is the one case the hand control was asked for."

  REQ-041:
    title: "Jog pre-start warning"
    clause_text: "The pre-start siren sounds for 1 s before jog movement begins and continues to sound while the pusher is transitioning."
    instances: []
    shared_output_warning: "The sounder is also REQ-003's 10 s plant pre-start output. A vector observing the sounder ALONE cannot attribute it to this clause — see AMB-PSH-08. Every assertion here carries the jog command as a co-observation."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN a jog command is asserted with the pusher at rest THEN the pre-start sounder is energised"
        normalised_text: "WHEN a jog command is asserted with the pusher at rest THEN the pre-start sounder is energised"
        id: REQ-041:614f3d
        response_signal: DQ10_SYS_PreStartSounder
        also_requires_observation_of: "DB_Controls.PusherJogExtendCmd, DB_Controls.PusherJogRetractCmd"
        bounds_depended_on: "[]"
        split_defect: "The jog moves the ram with no audible warning at all. A2 stays true if the movement is nonetheless delayed, and A3 is conditioned on a sounder that never came on."
      - ordinal: A2
        form: When
        text: "WHEN a jog command is asserted with the pusher at rest THEN the pusher does not move until at least the specified jog warning time has elapsed since the pre-start sounder was energised"
        normalised_text: "WHEN a jog command is asserted with the pusher at rest THEN the pusher does not move until at least the specified jog warning time has elapsed since the pre-start sounder was energised"
        id: REQ-041:3ed18c
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DQ7_PSH_Retract, DQ10_SYS_PreStartSounder, DB_Controls.PusherJogExtendCmd, DB_Controls.PusherJogRetractCmd"
        bounds_depended_on: "[jog_warning_time]"
        split_defect: "The sounder and the solenoid are energised in the same evaluation, so the warning has zero lead and the ram is already moving when the siren starts. A1 and A3 stay true — the sounder did come on and did stay on. *** J2: the whole purpose of the warning is the LEAD, and only a lower-bound assertion carries it. ***"
      - ordinal: A3
        form: When
        text: "WHEN the pusher is transitioning under a jog command THEN the pre-start sounder remains energised for the whole of the movement"
        normalised_text: "WHEN the pusher is transitioning under a jog command THEN the pre-start sounder remains energised for the whole of the movement"
        id: REQ-041:6f482b
        response_signal: DQ10_SYS_PreStartSounder
        also_requires_observation_of: "DQ6_PSH_Extend, DQ7_PSH_Retract"
        bounds_depended_on: "[]"
        split_defect: "The sounder is a one-shot of the warning time and drops while the ram is still travelling, so the audible warning covers the one second before the hazard and none of the hazard itself. A1 and A2 stay true."

  REQ-042:
    title: "Engineering pusher enable/disable"
    clause_text: "An engineering control enables or disables the pusher entirely (for test machines with no pusher installed)."
    instances: []
    note_on_grain: "One assertion. The DISABLED-state behaviour is REQ-043 and REQ-044 and is not restated here; what is left, and what nothing else carries, is the ENABLE direction."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the engineering pusher-enable control is returned to enabled after a period disabled THEN the pusher resumes normal operation"
        normalised_text: "WHEN the engineering pusher-enable control is returned to enabled after a period disabled THEN the pusher resumes normal operation"
        id: REQ-042:3a8afd
        response_signal: DQ3_PSH_RunPowerPack
        also_requires_observation_of: "DQ6_PSH_Extend, DB_Settings.PusherFitted"
        bounds_depended_on: "[]"
        split_defect: "The disable is latched rather than followed, so once disabled the pusher never comes back short of a power cycle. *** EVERY REQ-043 AND REQ-044 ASSERTION STAYS TRUE, BECAUSE THEY ONLY CONSTRAIN THE DISABLED STATE *** — the one-way failure is invisible to all three of them."

  REQ-043:
    title: "Disabled pusher: no outputs, no feedback supervision"
    clause_text: "With the pusher disabled, the system never attempts to run the power pack or drive the solenoids, and does not look for pusher switch feedback."
    instances: []
    third_limb: "'does not look for pusher switch feedback' yields no separate assertion — its only observable consequence is the absence of pusher faults, which is REQ-044 A1. Recorded, not dropped; see `partially_mined`."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER the power pack run command is asserted while the pusher is disabled by the engineering enable control"
        normalised_text: "NEVER the power pack run command is asserted while the pusher is disabled by the engineering enable control"
        id: REQ-043:a805c6
        response_signal: DQ3_PSH_RunPowerPack
        also_requires_observation_of: "DB_Settings.PusherFitted"
        bounds_depended_on: "[]"
        split_defect: "The disable reaches the solenoid outputs but not the pump command, so a test machine with no pusher fitted runs its hydraulic pack on every cycle attempt. A2 stays true."
      - ordinal: A2
        form: Never
        text: "NEVER an extend or retract solenoid output is asserted while the pusher is disabled by the engineering enable control"
        normalised_text: "NEVER an extend or retract solenoid output is asserted while the pusher is disabled by the engineering enable control"
        id: REQ-043:bc4d31
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DQ7_PSH_Retract, DB_Settings.PusherFitted"
        bounds_depended_on: "[]"
        split_defect: "The disable reaches the pump command but not the solenoids. A1 stays true. One assertion for both solenoids per J1 — the clause says 'the solenoids' generically."

  REQ-044:
    title: "Disabled pusher: no pusher faults"
    clause_text: "With the pusher disabled, no pusher faults are raised or visible on the screen."
    instances: []
    vector_note: "*** A CITING VECTOR SHOULD EXERCISE ALL FOUR PUSHER FAULTS *** (REQ-052, REQ-053, REQ-054, REQ-055). Suppressing three of four falsifies this assertion, but a vector exercising one would not detect it. That is attack 5 and it is judgement, not a mechanical check."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER a pusher fault is raised while the pusher is disabled by the engineering enable control"
        normalised_text: "NEVER a pusher fault is raised while the pusher is disabled by the engineering enable control"
        id: REQ-044:a34e8b
        response_signal: "the pusher fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DB_Settings.PusherFitted"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is a disable that suppresses the outputs but not the supervision, so a machine with no pusher fitted annunciates an end-travel timeout on every cycle attempt and the operator learns to ignore pusher faults."

  REQ-045:
    title: "Park after pre-start"
    clause_text: "When the pre-start (siren) phase completes, if the pusher is not at the parked position, it transitions to parked."
    instances: []
    negative_case_not_written: "The clause's implied negative — the pusher already at parked does not move — is not stated and its observable is a non-event indistinguishable from an idle machine. Not enumerated; recorded so the omission is visible."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the pre-start warning phase completes with the pusher away from the parked position THEN the pusher transitions to the parked position"
        normalised_text: "WHEN the pre-start warning phase completes with the pusher away from the parked position THEN the pusher transitions to the parked position"
        id: REQ-045:cccee0
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI12_PSH_HomeLimit"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is a start sequence that proceeds with the ram left extended from a previous run, so the first cycle of the shift starts from an unknown position and REQ-032's cycle definition is entered from the wrong end."

  REQ-046:
    title: "High-pressure hold while pushing"
    clause_text: "If the pusher high-pressure switch activates for more than 0.5 s while pushing, stop pushing and hold position."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the high-pressure switch is continuously active for longer than the specified pressure-trip confirm time while the pusher is on the push stroke THEN the extend solenoid output is de-energised"
        normalised_text: "WHEN the high-pressure switch is continuously active for longer than the specified pressure-trip confirm time while the pusher is on the push stroke THEN the extend solenoid output is de-energised"
        id: REQ-046:c28368
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_trip_confirm_time]"
        split_defect: "The pressure switch is not read on the push stroke at all, so the ram stalls against the blockage at full hydraulic pressure until something else times it out. A2 and A3 stay true."
      - ordinal: A2
        form: When
        text: "WHEN the high-pressure switch is continuously active for longer than the specified pressure-trip confirm time while the pusher is on the push stroke THEN the pusher holds its position and the retract solenoid output is not asserted"
        normalised_text: "WHEN the high-pressure switch is continuously active for longer than the specified pressure-trip confirm time while the pusher is on the push stroke THEN the pusher holds its position and the retract solenoid output is not asserted"
        id: REQ-046:016035
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI14_PSH_HighPressure, DQ6_PSH_Extend"
        bounds_depended_on: "[pressure_trip_confirm_time]"
        split_defect: "The pressure trip is treated as an abort and the ram retracts immediately, so REQ-047's resume-from-existing-position can never occur and REQ-048's five-trip count can never accumulate within one cycle. A1 stays true — pushing did stop. R2: two responses, one trigger."
      - ordinal: A3
        form: When
        text: "WHEN the high-pressure switch is active for less than the specified pressure-trip confirm time while the pusher is on the push stroke THEN the extend solenoid output is not de-energised"
        normalised_text: "WHEN the high-pressure switch is active for less than the specified pressure-trip confirm time while the pusher is on the push stroke THEN the extend solenoid output is not de-energised"
        id: REQ-046:398ce8
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_trip_confirm_time]"
        split_defect: "The confirm filter is absent, so a momentary pressure spike as the ram first meets the load stops every push and the cycle crawls to an end-travel timeout. A1 and A2 stay true. R1 — the trigger's NEGATIVE case, which the clause states explicitly with 'MORE THAN 0.5 s'."

  REQ-047:
    title: "Resume push after pressure clears"
    clause_text: "When the pressure is no longer high, plus a 5 s delay, pushing restarts from the existing position and the cycle continues."
    instances: []
    fourth_limb: "'and the cycle continues' yields no separate assertion — once the push resumes, REQ-032 A2/A3/A4 govern the remainder and a defect there falsifies them, not this clause."
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the high-pressure switch has been continuously inactive for the specified pressure-clear resume delay following a pressure hold THEN the extend solenoid output is re-asserted"
        normalised_text: "WHEN the high-pressure switch has been continuously inactive for the specified pressure-clear resume delay following a pressure hold THEN the extend solenoid output is re-asserted"
        id: REQ-047:2a4617
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_clear_resume_delay]"
        split_defect: "The push never resumes and the cycle stalls in the hold state indefinitely on a blockage that cleared itself. A2 and A3 stay true — nothing resumed early and nothing went home first."
      - ordinal: A2
        form: When
        text: "WHEN the high-pressure switch clears following a pressure hold THEN the extend solenoid output is not re-asserted before the specified pressure-clear resume delay has elapsed since the switch cleared"
        normalised_text: "WHEN the high-pressure switch clears following a pressure hold THEN the extend solenoid output is not re-asserted before the specified pressure-clear resume delay has elapsed since the switch cleared"
        id: REQ-047:a2a197
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_clear_resume_delay]"
        split_defect: "The resume delay is absent or under-scaled, so the ram immediately re-loads the blockage and hammers it — the delay exists to give the shredder time to swallow what was already delivered. A1 and A3 stay true. J2."
      - ordinal: A3
        form: When
        text: "WHEN the push resumes following a pressure hold THEN the pusher resumes from the position at which it held, without first returning to the parked position"
        normalised_text: "WHEN the push resumes following a pressure hold THEN the pusher resumes from the position at which it held, without first returning to the parked position"
        id: REQ-047:72809f
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DQ6_PSH_Extend, DI12_PSH_HomeLimit"
        bounds_depended_on: "[]"
        split_defect: "The resume is implemented as abort-and-restart — the ram retracts to parked and begins a fresh stroke — so every pressure event costs a full return and REQ-048's 'five times on the same cycle' counts strokes rather than trips within one, quietly disarming the blocked fault. A1 and A2 stay true: pushing did resume, and it resumed late enough."

  REQ-048:
    title: "Pressure-trip count: return and fault"
    clause_text: "If high pressure activates 5 times on the same cycle, the pusher returns to parked and a pusher-blocked fault is raised."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the high-pressure switch has produced the specified pressure-trip count of confirmed trips within one pusher cycle THEN the pusher returns to the parked position"
        normalised_text: "WHEN the high-pressure switch has produced the specified pressure-trip count of confirmed trips within one pusher cycle THEN the pusher returns to the parked position"
        id: REQ-048:3155e8
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI12_PSH_HomeLimit, DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_trip_count_threshold, pressure_trip_confirm_time]"
        split_defect: "The count raises the fault but leaves the ram where it stopped, extended into a chamber that has to be cleared by hand with the ram in the way. A2 and A3 stay true. *** SEE AMB-PSH-01 — THIS ASSERTION AND REQ-050 A1 ARE IN TENSION AND THE TENSION IS THE REGISTER'S. ***"
      - ordinal: A2
        form: When
        text: "WHEN the high-pressure switch has produced the specified pressure-trip count of confirmed trips within one pusher cycle THEN the pusher-blocked fault is raised"
        normalised_text: "WHEN the high-pressure switch has produced the specified pressure-trip count of confirmed trips within one pusher cycle THEN the pusher-blocked fault is raised"
        id: REQ-048:f34a71
        response_signal: "the pusher-blocked fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_trip_count_threshold, pressure_trip_confirm_time]"
        split_defect: "The ram parks silently on the fifth trip with nothing annunciated, so the operator sees an idle pusher and is given no reason for it. A1 and A3 stay true. R2 — two responses to one trigger."
      - ordinal: A3
        form: When
        text: "WHEN fewer than the specified pressure-trip count of confirmed trips have occurred within the current pusher cycle THEN the pusher-blocked fault is not raised"
        normalised_text: "WHEN fewer than the specified pressure-trip count of confirmed trips have occurred within the current pusher cycle THEN the pusher-blocked fault is not raised"
        id: REQ-048:fea9bf
        response_signal: "the pusher-blocked fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[pressure_trip_count_threshold]"
        split_defect: "*** THE TRIP COUNTER IS NOT CLEARED AT THE START OF EACH CYCLE, SO TRIPS ACCUMULATE ACROSS CYCLES AND A LATER CYCLE RAISES THE BLOCKED FAULT ON ITS FIRST PRESSURE EVENT. *** 'On the same cycle' is the load-bearing phrase of this clause and nothing else in 44 assertions carries it. Also catches an off-by-one threshold. A1 and A2 stay true — both are conditioned on the count having been reached."

  REQ-049:
    title: "Blocked fault spares the shredder"
    clause_text: "The pusher-blocked fault does not stop the shredder."
    instances: []
    subject_note: "The response signal is a SHREDDER output. The obligation is nonetheless on the pusher fault's propagation, so the clause is in subject; a citation for the shredder's own start/stop behaviour is NOT this assertion."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER the shredder is stopped as a consequence of the pusher-blocked fault"
        normalised_text: "NEVER the shredder is stopped as a consequence of the pusher-blocked fault"
        id: REQ-049:6e8da3
        response_signal: DQ1_SHR_RunFwd
        also_requires_observation_of: "the pusher-blocked fault annunciation (NO TAG NAMED IN THE REGISTER)"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is a pusher-blocked fault wired into the common plant stop chain, so a hydraulic blockage in an auxiliary takes the whole shredder down with it and the plant loses a shift for a fault the spec explicitly said to tolerate."

  REQ-050:
    title: "Blocked lockout until reset"
    clause_text: "After a pusher-blocked fault, the pusher is locked out from activating until the fault has been reset."
    instances: []
    reading_taken: "'activating' is read as INITIATING A NEW CYCLE, not as any solenoid output. *** THAT IS A CHOICE, FORCED, AND IT IS AMB-PSH-01. *** The alternative reading makes REQ-048 A1 unsatisfiable, and an enumeration must not contain two assertions no implementation can both satisfy."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER a pusher cycle is initiated while a pusher-blocked fault is latched and has not been reset since it was raised"
        normalised_text: "NEVER a pusher cycle is initiated while a pusher-blocked fault is latched and has not been reset since it was raised"
        id: REQ-050:218e5d
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "the pusher-blocked fault annunciation (NO TAG NAMED IN THE REGISTER), DB_Controls.FaultReset"
        bounds_depended_on: "[]"
        split_defect: "The blocked fault annunciates but nothing inhibits the next trigger, so the ram keeps re-attempting a stroke into a blockage that has already defeated it five times. A2 stays true. See AMB-PSH-07 on whether a held reset defeats this."
      - ordinal: A2
        form: When
        text: "WHEN the fault reset command is asserted after a pusher-blocked fault THEN the pusher is able to be cycled again"
        normalised_text: "WHEN the fault reset command is asserted after a pusher-blocked fault THEN the pusher is able to be cycled again"
        id: REQ-050:11d689
        response_signal: DQ6_PSH_Extend
        also_requires_observation_of: "DB_Controls.FaultReset"
        bounds_depended_on: "[]"
        split_defect: "The lockout is one-way — once a blocked fault has occurred the pusher never runs again short of a power cycle, and the operator's reset button does nothing. A1 stays true throughout, which is exactly why a lockout assertion alone cannot catch it. R1 — 'until the fault has been reset' states both sides."

  REQ-051:
    title: "Pressure ignored on retract"
    clause_text: "The pressure switch is ignored on the retract stroke."
    instances: []
    reading_taken: "'Ignored' is read as TOTAL — no effect on the stroke and no effect on the count. That is a judgement; the narrower reading (the stroke only) would drop A2."
    assertions:
      - ordinal: A1
        form: Never
        text: "NEVER the retract solenoid output is de-energised as a consequence of the high-pressure switch activating during the retract stroke"
        normalised_text: "NEVER the retract solenoid output is de-energised as a consequence of the high-pressure switch activating during the retract stroke"
        id: REQ-051:ddd57f
        response_signal: DQ7_PSH_Retract
        also_requires_observation_of: "DI14_PSH_HighPressure"
        bounds_depended_on: "[]"
        split_defect: "The pressure logic is stroke-blind, so ordinary back pressure on the return stalls the ram part way home, it never reaches the parked switch, and REQ-055's parked timeout fires on a healthy machine. A2 stays true."
      - ordinal: A2
        form: Never
        text: "NEVER a high-pressure activation occurring during the retract stroke contributes to the pressure-trip count that raises the pusher-blocked fault"
        normalised_text: "NEVER a high-pressure activation occurring during the retract stroke contributes to the pressure-trip count that raises the pusher-blocked fault"
        id: REQ-051:94096e
        response_signal: "the pusher-blocked fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI14_PSH_HighPressure, DQ7_PSH_Retract"
        bounds_depended_on: "[pressure_trip_count_threshold]"
        split_defect: "The retract stroke correctly does not stop on pressure, but the trips are still counted, so a cycle with normal return pressure reaches the five-trip threshold and raises a blocked fault for a blockage that never happened. A1 stays true — this is the half of 'ignored' that leaves no trace on the stroke itself."

  REQ-052:
    title: "Fault: both pusher switches"
    clause_text: "Both pusher limit switches on at the same time is a pusher fault, annunciated on the display."
    instances: []
    rig_note: "*** Reaching this trigger requires both limit inputs true simultaneously, which the physical machine cannot produce. A candidate for the gate-1 signer's UNTESTABLE-ON-RIG bucket. NOT ASSIGNED HERE (4.3). ***"
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the parked limit switch and the end-travel limit switch are both true at the same time THEN the both-switches pusher fault is raised"
        normalised_text: "WHEN the parked limit switch and the end-travel limit switch are both true at the same time THEN the both-switches pusher fault is raised"
        id: REQ-052:925a32
        response_signal: "the both-pusher-switches fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI12_PSH_HomeLimit, DI13_PSH_FullTravelLimit"
        bounds_depended_on: "[]"
        split_defect: "Sole assertion of the clause. Its own defect is that the impossible-combination check is simply not implemented, so a welded, shorted or miswired limit switch is invisible and every position-dependent decision in the cycle acts on a state that cannot be true."

  REQ-054:
    title: "Fault: end-travel timeout"
    clause_text: "The pusher taking too long to reach the end-travel switch is a fault, annunciated on the display."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the pusher has been driving on the push stroke for longer than the specified end-travel timeout without the end-travel limit switch making THEN the end-travel-timeout fault is raised"
        normalised_text: "WHEN the pusher has been driving on the push stroke for longer than the specified end-travel timeout without the end-travel limit switch making THEN the end-travel-timeout fault is raised"
        id: REQ-054:f54a2e
        response_signal: "the end-travel-timeout fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI13_PSH_FullTravelLimit, DQ6_PSH_Extend"
        bounds_depended_on: "[pusher_end_travel_timeout]"
        split_defect: "There is no travel supervision at all, so a ram that has lost hydraulic pressure, or a limit switch that has failed open, leaves the cycle waiting forever with nothing annunciated. A2 stays true. *** SEE AMB-PSH-02 — WHETHER THIS TIMER PAUSES DURING A REQ-046 PRESSURE HOLD IS UNSTATED, AND THE ANSWER DECIDES WHETHER REQ-048 IS REACHABLE AT ALL. ***"
      - ordinal: A2
        form: When
        text: "WHEN the pusher reaches the end-travel limit before the specified end-travel timeout has elapsed THEN the end-travel-timeout fault is not raised"
        normalised_text: "WHEN the pusher reaches the end-travel limit before the specified end-travel timeout has elapsed THEN the end-travel-timeout fault is not raised"
        id: REQ-054:9a52ca
        response_signal: "the end-travel-timeout fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI13_PSH_FullTravelLimit, DQ6_PSH_Extend"
        bounds_depended_on: "[pusher_end_travel_timeout]"
        split_defect: "The supervision timer is not reset on arrival at the limit, or the timeout preset is under-scaled, so a perfectly healthy cycle annunciates a travel fault on every stroke and the fault stops meaning anything. A1 stays true. J2 — an under-scaled timeout is caught only from this side."

  REQ-055:
    title: "Fault: parked timeout"
    clause_text: "The pusher taking too long to reach the parked switch is a fault."
    instances: []
    assertions:
      - ordinal: A1
        form: When
        text: "WHEN the pusher has been driving on the retract stroke for longer than the specified parked timeout without the parked limit switch making THEN the parked-timeout fault is raised"
        normalised_text: "WHEN the pusher has been driving on the retract stroke for longer than the specified parked timeout without the parked limit switch making THEN the parked-timeout fault is raised"
        id: REQ-055:341c91
        response_signal: "the parked-timeout fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI12_PSH_HomeLimit, DQ7_PSH_Retract"
        bounds_depended_on: "[pusher_parked_timeout]"
        split_defect: "Only the end-travel stroke is supervised, so a ram that cannot get home sits part way out with nothing annunciated and the next cycle starts from a position the logic believes is parked. REQ-054's assertions stay true — they watch the other stroke."
      - ordinal: A2
        form: When
        text: "WHEN the pusher reaches the parked limit before the specified parked timeout has elapsed THEN the parked-timeout fault is not raised"
        normalised_text: "WHEN the pusher reaches the parked limit before the specified parked timeout has elapsed THEN the parked-timeout fault is not raised"
        id: REQ-055:e662ca
        response_signal: "the parked-timeout fault annunciation — *** NO TAG NAMED IN THE REGISTER, see AMB-PSH-14 ***"
        also_requires_observation_of: "DI12_PSH_HomeLimit, DQ7_PSH_Retract"
        bounds_depended_on: "[pusher_parked_timeout]"
        split_defect: "The retract supervision timer is not reset on arrival home, or the 30 s preset is under-scaled against a slow return, so every normal cycle ends in a parked-timeout fault. A1 stays true. J2."
