# THE SPEC-DERIVED ASSERTION ENUMERATION — the pusher
#
# The DENOMINATOR. Produced from the specification only, before any vector exists, by a third party to
# the block's author and the vector's author (docs/notes/assertion-enumeration.md; §7 open item 3).
#
# ISSUE 1 — 2026-09-02. First enumeration of this subject. No prior enumeration exists, so §2.3's
# "a re-decomposition that yields a different count is its own event" has nothing to compare against.
#
# *** THIS FILE IS UNSTAMPED. IT CARRIES `normalised_text:` AND NO `id:` KEY, PER §3.4. ***
# The enumerator is denied Bash deliberately — the fence that stops the implementation contaminating a
# spec-side denominator also removes every way to compute a SHA-256. Hand-written hex is exactly what
# gate 3g (`IdsRecompute`) exists to catch. Run `EnumerationStamper.Stamp` over THIS file; the stamped
# output is what may be published and cited. *** NO VECTOR MAY CITE THIS FILE AS IT STANDS. ***
#
# The sibling `assertions.json` is the projection the gate consumes plus this file's findings in
# machine-readable form. IT IS NOT STAMPABLE — the stamper is line-oriented over this YAML shape and
# refuses anything else. This file is the source of truth.

enumerator: assertion-enumerator
enumerator_vocabulary: >-
  ROLE form (test-environment-contract.md §1.1). No session id was available to me, and the convention
  says an instance identity is DERIVED, never invented. Consequence, stated so it is not read as a
  green: against a block author or vector author stamped in the INSTANCE form
  `<session-id>/<agent-type>`, gate 3d returns NotComparable -> NOT CHECKED, which is never a pass.
  The repair is the coordinator's, not a resubmission's: stamp both sides in the same vocabulary.
  *** I DID NOT WRITE `owner:` — an agent never writes that form (§1.1 eligibility rule). ***
issue: 1
enumerated: 2026-09-02
register: gen/test-project001/requirements.md
register_clause_ids_stable: true
register_clause_id_form: "### REQ-nnn — <title>; the register states IDs are 'stable forever, never renumbered, never reused'"

# ---------------------------------------------------------------------------------------------------
# THE SUBJECT (§1.4). A citation for another component must FAIL TO JOIN rather than silently succeed.
# ---------------------------------------------------------------------------------------------------
subject: pusher
subject_long: >-
  The pusher control function of test-project001 — the hydraulic power pack, the extend and retract
  solenoids, the parked and end-travel limit switches, the high-pressure switch, the pusher cycle and
  its modes, hand jog, the engineering pusher enable, and the four pusher-specific faults.
subject_determined_from: >-
  *** THE REGISTER'S OWN SECTION STRUCTURE AND CLAUSE TEXT, NOT FROM ANY ARCHITECTURE ARTIFACT. ***
  The register groups these clauses under the headings "Shredder pusher" (REQ-030…044), "Pusher
  sequence" (REQ-045…051) and "Pusher faults" (REQ-052…055); REQ-025 is in subject because its own
  Text names the pusher as the responder. No block name is used to define the subject and none appears
  in any assertion text.
subject_is_not: >-
  This enumeration is NOT the denominator for the plant start sequence, the stop sequence, the hopper
  high-level control of the infeed, the overcurrent detection chain, the display/HMI layer, or the
  in-cycle lamp. A coverage figure for any of those measured against this denominator answers a
  different question (§1.4's measured failure).

