    limb: "'and does not look for pusher switch feedback'"
    treatment: "NO SEPARATE ASSERTION. Its only observable consequence is the absence of pusher faults."
    destination: "REQ-044 A1 — IN THIS ARTIFACT, ENUMERATED"
    honesty_note: "Recorded rather than dropped. If a reader believes 'does not look for feedback' has an observable consequence other than fault suppression, that is a decomposition dispute and the channel is below."
  - clause: REQ-044
    limb: "'or visible on the screen'"
    destination: "an HMI / text-display enumeration"
    destination_status: "*** DOES NOT EXIST — A GAP ***"
  - clause: REQ-052
    limb: "'annunciated on the display'"
    destination: "an HMI / text-display enumeration"
    destination_status: "*** DOES NOT EXIST — A GAP ***"
  - clause: REQ-054
    limb: "'annunciated on the display'"
    destination: "an HMI / text-display enumeration"
    destination_status: "*** DOES NOT EXIST — A GAP ***"

considered_and_out_of_subject:
  - clause: REQ-012
    text: "Pressing the stop pushbutton stops all equipment at the same time."
    finding: >-
      *** THE PUSHER IS EQUIPMENT, SO THIS CLAUSE CARRIES A PUSHER OBLIGATION — AND IT IS NOT
      ENUMERABLE AS WRITTEN. *** "Stops" has no defined meaning for a hydraulic ram mid-stroke: drop
      both solenoids and leave it where it is (REQ-039's jog semantics), or retract to parked
      (REQ-037's off semantics)? The two are opposite implementations and the clause chooses neither.
      NOT turned into a vague assertion. RAISED — see AMB-PSH-03.
  - clause: REQ-013
    text: "Loss of downstream available stops all equipment at the same time."
    finding: "Identical to REQ-012. AMB-PSH-03."
  - clause: REQ-014
    finding: >-
      Checked deliberately, because it is the §1.4 shape. REQ-014's SOURCE quote carries "stop infeed
      conveyor and perform 1 cycle of the pusher" while its TEXT carries only the infeed limb. The
      dropped pusher limb SURVIVES at REQ-034, which is enumerated, so nothing is lost. Recorded so a
      later reader does not have to re-derive that.
  - clause: REQ-061
    finding: "E-stop, hardwired safety circuit. Register class `out-of-scope`. *** NOT ENUMERATED, NOT DESCRIBED, NOT DECOMPOSED — CLAUDE.md hard rule 2. *** No `NEVER` here refers to it."
  - clause: REQ-062
    finding: "No auto-restart after E-stop recovery. Plant-level; states no pusher-specific obligation. Destination: a plant-sequence enumeration, which does not exist."
  - clause: REQ-063
    finding: "Motor failed to run stops the shredder system. Plant-level. Same destination, same status."
  - clause: REQ-069
    finding: "The in-cycle lamp reads the pusher power-pack running feedback, but its response signal is a system lamp and its obligation is on the lamp. Out of subject. Destination: an HMI/indication enumeration, which does not exist."

# ---------------------------------------------------------------------------------------------------
# AMBIGUITIES AND CONTRADICTIONS — raised, never resolved here.
# Routed to whoever signs off the architecture at gate 1, by analogy with §4.3 (§7 open item 2 says
# the dispute channel has no home; this is an analogy, not a ruling).
# ---------------------------------------------------------------------------------------------------
ambiguities_open:

  - id: AMB-PSH-01
    severity: HIGH
    kind: "*** INTERNAL CONTRADICTION — REQ-048 versus REQ-050. ***"
    what: >-
      REQ-048 says that on the fifth pressure trip "the pusher RETURNS TO PARKED and a pusher-blocked
      fault is raised". REQ-050 says that "after a pusher-blocked fault, the pusher is LOCKED OUT FROM
      ACTIVATING until the fault has been reset". Taken in the order REQ-048 states them, the lockout
      is in force at the instant the return-to-parked is commanded. *** ON THE STRICT READING THE RAM
      IS STRANDED MID-STROKE BY ITS OWN FAULT, AND REQ-048's OWN RESPONSE IS UNREACHABLE. ***
    readings: >-
      (a) "activating" means INITIATING A NEW CYCLE; the commanded return to parked completes and only
      the next cycle is inhibited. (b) "activating" means any solenoid output; the return never
      happens and REQ-048's first response is dead text.
    what_i_did: >-
      Took reading (a) into REQ-050 A1's trigger, using the clause's own word scoped to cycle
      initiation, because writing (b) would have put two MUTUALLY FALSIFYING assertions into one
      denominator — REQ-048 A1 and REQ-050 A1 would each be true only when the other was false, and
      no implementation could satisfy both. *** THAT IS A CHOICE AND IT IS RECORDED AS ONE. *** If the
      ruling goes to (b), REQ-050 A1's text moves and re-hashes, and REQ-048 A1 must be withdrawn.
    who_must_rule: "the gate-1 architecture signer"

  - id: AMB-PSH-02
    severity: HIGH
    kind: "*** A REQUIREMENT PARTLY UNREACHABLE UNDER ANOTHER — REQ-046/047/048 versus REQ-054. ***"
    what: >-
      REQ-046 holds the push indefinitely while pressure is high; REQ-047 resumes 5 s after it clears;
      REQ-048 allows five such trips before declaring the pusher blocked. REQ-054 faults the pusher for
      taking longer than the end-travel timeout to reach the end-travel switch. Worked: a cycle with
      four pressure events, each held for 6 s and resumed after 5 s, has spent 44 s stationary before
      any push time is counted — against a 60 s end-travel timeout (Q-02's number, not the spec's).
      *** SO ON A GENUINELY BLOCKED CYCLE, REQ-054's END-TRAVEL FAULT FIRES BEFORE REQ-048's FIFTH TRIP
      IS EVER REACHED, AND THE PUSHER-BLOCKED FAULT — THE ONE THAT NAMES THE ACTUAL CONDITION — RARELY
      OR NEVER ANNUNCIATES. ***
    what_is_unstated: >-
      Whether the end-travel supervision timer PAUSES during a REQ-046 pressure hold. The register does
      not say. Under "pauses", the two requirements compose. Under "runs free", REQ-048 and REQ-053 are
      largely unreachable and the operator is told the wrong thing about a blocked machine.
    what_i_did: >-
      Neither reading was taken into any assertion text. REQ-054 A1's trigger is written as "driving on
      the push stroke for longer than the specified end-travel timeout", which is the clause's own
      wording and is silent on the pause. If the ruling goes to "pauses", REQ-054 A1 needs a further
      assertion covering the pause and the cost is one UNCLASSIFIED unit and no dangled citation.
    who_must_rule: "the gate-1 architecture signer, and it may need the owner"

  - id: AMB-PSH-03
    severity: HIGH
    kind: "A pusher obligation that exists and cannot be decomposed."
    clause: "REQ-012 and REQ-013"
    what: >-
      "Stops all equipment at the same time" covers the pusher, and states no meaning for stopping a
      hydraulic ram mid-stroke. Drop-in-place and retract-to-parked are opposite implementations and
      both are defensible from other clauses in this register (REQ-039's jog release stops in place;
      REQ-037's off retracts to parked). *** NOT ENUMERATED, AND SAID SO RATHER THAN LEFT EMPTY. ***
      Left as it stands, the pusher's stop behaviour is in no denominator anywhere.
    would_settle_it: "One clause added to REQ-012 naming the pusher's stop behaviour. It then yields one or two assertions here."

  - id: AMB-PSH-04
    severity: HIGH
    kind: "The register-wide form of the mode-exclusivity hole."
    what: >-
      REQ-034 says "IN AUTOMATIC MODE, a pusher cycle is triggered by hopper high level"; REQ-035 says
      "IN MANUAL MODE, the operator can trigger a cycle with the HMI button". *** NEITHER CLAUSE STATES
      A NEGATIVE, SO NOTHING IN THIS ENUMERATION FORBIDS AN IMPLEMENTATION THAT CYCLES ON HOPPER HIGH
      REGARDLESS OF MODE, OR THAT HONOURS THE HMI BUTTON IN AUTOMATIC AND IN OFF. *** R1 says the
      negative case is the one most often lost and says to write it WHERE THE SPEC STATES ONE. This
      spec does not state one, and inventing it is how a denominator stops being spec-derived.
    consequence_if_left: >-
      An operator pressing the HMI cycle button with the mode selector at OFF gets a stroke of a ram
      that the machine says is switched off. Nothing in 44 assertions catches that.
    would_settle_it: >-
      One line in the register: each mode's trigger set is exclusive to that mode. It costs zero
      re-hashes here and adds three or four assertions.
    who_must_rule: "the gate-1 architecture signer"

  - id: AMB-PSH-05
    severity: MEDIUM
    kind: "A bound stated as an approximation."
    what: >-
      REQ-032's end-travel dwell is "approximately 2 s" and REQ-029 uses "approximately 2–3 s" for a
      different function, so the register does use ranges when it means them. "Approximately" states no
      tolerance. REQ-032 A3 asserts the dwell is not cut short, and how short is short is undecided —
      a 1.9 s dwell and a 0.2 s dwell are both "approximately 2 s" under some reading.
    what_i_did: "Wrote the assertion against 'the specified end-travel hold time' and put the number only in the bounds table, so a ruling on the tolerance costs zero re-hashes."

  - id: AMB-PSH-06
    severity: MEDIUM
    kind: "One trigger, two readings, opposite plant behaviour."
    clause: REQ-034
    what: >-
      "In automatic mode, a pusher cycle is triggered by hopper high level." Worked, on a hopper that
      goes high at t=0 and stays high through t=300 s: reading (a) EDGE — exactly one cycle, at t=0,
      and no more however long the level stays high; reading (b) LEVEL — a cycle at t=0 and another
      each time the previous one completes, until the level clears. Both are ordinary designs and (b)
      is arguably what a shredder hopper wants. The clause chooses neither.
    what_i_did: >-
      REQ-034 A1 asserts only that A cycle is performed on the transition to high, which BOTH readings
      satisfy. No assertion constrains repetition. If the ruling goes to (a), one further assertion is
      owed — "the pusher does not begin a further cycle while the level input remains continuously
      high" — and its cost is one UNCLASSIFIED unit.

  - id: AMB-PSH-07
    severity: MEDIUM
    kind: "Edge or level, on a reset — the defect class the hopper enumeration found the hard way."
    clause: REQ-050
    what: >-
      "until the fault has been reset" does not say whether the reset is an edge or a level. A
      level-sensitive lockout release with a stuck-on or HMI-latched reset command leaves the pusher
      permanently un-locked-out, so REQ-050 A1's protection is silently absent whenever the reset bit
      is held. The hopper register carried the mirror image of this (its REQ-HBA-005 A4) and it needed
      its own assertion.
    what_i_did: >-
      Wrote REQ-050 A1 as "has not been reset SINCE IT WAS RAISED", which is edge-flavoured, and did
      not add a separate held-reset assertion, because the clause supplies no basis for one. If the
      ruling says the reset is edge-triggered, one `NEVER` assertion is owed here.

  - id: AMB-PSH-08
    severity: MEDIUM
    kind: "A shared output, two requirements, and no way to tell them apart."
    what: >-
      REQ-041's jog warning and REQ-003's 10 s plant pre-start drive the SAME sounder output. A vector
      observing the sounder alone cannot tell which requirement energised it. Every REQ-041 assertion
      therefore carries the jog command in `also_requires_observation_of` — the AMB-14 shape, which the
      wire format now supports via `requiredObservations`.

  - id: AMB-PSH-09
    severity: MEDIUM
    kind: "A warning with no stated re-arming rule."
    clause: "REQ-041 x REQ-039"
    what: >-
      REQ-039 makes jog hold-to-move, so an operator inching a ram taps the button repeatedly. REQ-041
      requires 1 s of siren before movement. Worked: press at t=0, siren from t=0, movement from
      t=1.0, release at t=1.4, press again at t=1.6 — does movement resume at t=1.6, or at t=2.6 after
      a fresh 1 s warning? The first makes the warning defeatable by tapping; the second makes inching
      unusable. The clause says neither.
    what_i_did: "REQ-041 A2's trigger is 'a jog command asserted WITH THE PUSHER AT REST', which is the clause's own scope and is silent on re-arming."

  - id: AMB-PSH-10
    severity: LOW
    kind: "A requirement with no stated bound where one is implied."
    clause: REQ-025
    what: "'The pusher returns to parked' on an overcurrent event states no time limit, so an implementation that begins the return and takes arbitrarily long satisfies it. No bound was invented (§1.2a)."

  - id: AMB-PSH-11
    severity: LOW
    kind: "Nothing stops the power pack."
    clause: REQ-031
    what: >-
      REQ-030 requires the pack running during movement and REQ-031 requires a run-on across the
      push/retract transition. *** NO CLAUSE IN THE REGISTER SAYS THE PACK EVER STOPS. *** An
      implementation running it continuously satisfies every pusher assertion here. Not enumerated,
      because no clause states it; raised because the omission is invisible from the assertion list.

  - id: AMB-PSH-12
    severity: LOW
    kind: "A dangling reference in the register."
    what: >-
      Q-16's resolution cites "both pre-warned per NEW-4". *** THERE IS NO NEW-4 IN THIS REGISTER. ***
      REQ-037 A2's provenance rests on Q-16, whose own justification points at a row that does not
      exist. Reported as a register defect, not worked around.

  - id: AMB-PSH-13
    severity: LOW
    kind: "A trigger signal that does not exist."
    clause: REQ-036
    what: >-
      The remote cycle pushbutton is marked PROPOSED — no digital input tag exists, and Q-03 is open on
      what `DI16_PSH_LocalRemote` even means. *** THE ASSERTION IS ENUMERATED ANYWAY. *** Dropping a
      spec obligation because no tag exists yet is denominator shrinkage, and the honest destination is
      a bucket the gate-1 signer assigns, not an omission the enumerator makes (§4.3).

  - id: AMB-PSH-14
    severity: MEDIUM
    kind: "Four response signals this enumeration cannot name."
    what: >-
      The register says an annunciation bit for each pusher fault "exists in the corpus alarm word
      (grep-verified)" and *** NAMES NONE OF THEM. *** Six assertions (REQ-044 A1, REQ-048 A2/A3,
      REQ-049 A1, REQ-051 A2, REQ-052 A1, REQ-054 A1/A2, REQ-055 A1/A2) have a response signal I can
      describe and cannot name. A vector author will need the tag. *** THE REPAIR IS TO THE REGISTER OR
      THE HARNESS BINDING, NEVER TO THIS FILE *** — an enumerator inventing an alarm-bit name would be
      breaking hard rule 3 to make a citation work, which is the request this role exists to refuse.

