# BOUNDS (§1.2a and AMB-19). Clauses refer to this table BY NAME. No number enters any hashed text.
# *** EVERY BOUND STATES ITS KIND. *** Three of the eight have NO source-document number at all.
# ---------------------------------------------------------------------------------------------------
bounds:
  pressure_trip_confirm_time:   "0.5 s"
  pressure_clear_resume_delay:  "5 s"
  pressure_trip_count_threshold: "5 trips within one pusher cycle"
  end_travel_hold_time:         "approximately 2 s"
  jog_warning_time:             "1 s"
  pusher_end_travel_timeout:    "60 s"
  pusher_parked_timeout:        "30 s"
  pump_run_on_time:             "5 s"

bounds_provenance:
  pressure_trip_confirm_time:   "SPEC-STATED. FuncDesc §Sequence — 'activates for >0.5s'. Kind: a MINIMUM PERSISTENCE — the condition must hold continuously for at least this long before the response is owed."
  pressure_clear_resume_delay:  "SPEC-STATED. FuncDesc §Sequence — 'not high level + 5s time delay'. Kind: a MINIMUM DELAY between the clearing event and the resume."
  pressure_trip_count_threshold: "SPEC-STATED. FuncDesc §Sequence — '5 times on the same cycle'. Kind: a COUNT within a scope, not a duration; the scope is the load-bearing half."
  end_travel_hold_time:         "SPEC-STATED BUT APPROXIMATE. FuncDesc §Shredder Pusher — 'hold a short pause of approx. 2 sec'. Kind: a MINIMUM DWELL before the retract stroke begins. See AMB-PSH-05 — 'approximately' states no tolerance."
  jog_warning_time:             "SPEC-STATED. FuncDesc §Shredder Pusher — 'Sound the pre-start for 1s before moving'. Kind: a MINIMUM LEAD TIME between the warning starting and movement being permitted."
  pusher_end_travel_timeout:    "*** NO SPEC NUMBER. *** The register's settings table says 'none stated'; 60 s is a commissioning default signed off by the owner on 2026-07-16 (Q-02). Kind: a MAXIMUM ELAPSED DRIVE TIME before the fault is owed."
  pusher_parked_timeout:        "*** NO SPEC NUMBER. *** As above; 30 s, owner sign-off 2026-07-16 (Q-02). Kind: a MAXIMUM ELAPSED DRIVE TIME."
  pump_run_on_time:             "*** NO SPEC NUMBER. *** As above; 5 s, owner sign-off 2026-07-16 (Q-02). *** NO ASSERTION IN THIS ENUMERATION DEPENDS ON IT *** — REQ-031's clause states no duration and §1.2a forbids importing one that the specification does not state. Carried here only so the table is complete."

bounds_warning: >-
  *** THREE OF THE EIGHT BOUNDS REST ENTIRELY ON A Q-02 COMMISSIONING SIGN-OFF, NOT ON EITHER SOURCE
  DOCUMENT. *** That is a legitimate spec-side provenance (a recorded owner decision) and it is NOT a
  number derived from the test apparatus, which §1.2a forbids. It is recorded because a retune of any
  of them changes the truth conditions of REQ-054's and REQ-055's assertions while moving zero IDs —
  which is precisely AMB-19, and gate 3i is what catches it.

# ---------------------------------------------------------------------------------------------------
denominator:
  clauses_in_subject: 27
  clauses_yielding_assertions: 25
  clauses_not_decomposable: 2
  assertions: 44
  coverage_units: 44

forms_summary: {When: 33, Never: 11}

decomposition_judgements_declared:
  - id: J1
    what: "SPLIT ON DIRECTION ONLY WHERE THE CLAUSE ITSELF NAMES BOTH DIRECTIONS."
    why: >-
      Extend and retract are two distinct observable outputs, so R2 would license splitting every
      pusher clause in two, and a defect asymmetric between the paths is nameable for nearly all of
      them. That is §5 attack 2 wearing a rule as a costume — it doubles the easy clauses. The line
      drawn instead is spec-derived: REQ-030 says "the extend or retract solenoids" and REQ-038 says
      "a jog button for each direction", so those split; REQ-039, REQ-040 and REQ-043 speak of the jog
      or of the solenoids generically, so those do not. An asymmetric defect still falsifies the
      single generic assertion — nothing is lost from the denominator, only from its size.
  - id: J2
    what: "A LOWER-BOUND ASSERTION IS WRITTEN WHEREVER A CLAUSE STATES A DELAY, DWELL OR TIMEOUT."
    why: >-
      R3 says a bound qualifies a response rather than splitting it, and that is right where the only
      defect is the number being wrong. It is not right where the response can arrive EARLY: an
      upper-bound or arrival assertion is satisfied MORE easily by an under-scaled preset, not less.
      The hopper enumeration hit this exactly (its issue 5, REQ-HBA-002 A3) and it took a vector author
      to find it. So REQ-032, REQ-041, REQ-046, REQ-047, REQ-048, REQ-054 and REQ-055 each carry the
      "does not happen before" limb as its own assertion, with the under-scaled preset named as its
      isolating defect. This is the single largest contributor to the count and it is a judgement.
  - id: J3
    what: "A CLAUSE THAT DECLARES A VOCABULARY RATHER THAN A BEHAVIOUR YIELDS NO ASSERTION."
    why: >-
      REQ-033 (three modes exist) and REQ-053 (the blocked fault is annunciated) state no observable
      consequence that is not already stated by a sibling clause. Manufacturing one would be inventing
      a reading. Both are named below under `not_decomposable` with their destinations, because §1.4's
      measured failure is a clause QUOTED in the file that produced no assertion and read as covered.
  - id: J4
    what: "AN ANNUNCIATION CLAUSE IS MINED FOR ITS RAISE LIMB; ITS DISPLAY LIMB IS OUT OF SUBJECT."
    why: >-
      "annunciated on the display" is an obligation on the HMI layer, not on the pusher control
      function. Every such limb is recorded as PARTIALLY MINED with a named destination — and that
      destination DOES NOT EXIST, so it reads as the gap it is rather than as a tidy exclusion.

# ---------------------------------------------------------------------------------------------------
not_decomposable:
  - clause: REQ-033
    title: "Three pusher modes"
    text: "The pusher has three modes of operation: off, automatic, manual."
    why: >-
      *** A DECLARATION OF VOCABULARY, NOT A STATEMENT ABOUT OBSERVABLE BEHAVIOUR. *** Nothing here can
      be falsified by an implementation defect on its own: the observable content of each mode is
      stated by REQ-034 (automatic), REQ-035 and REQ-036 (manual) and REQ-037 (off), all enumerated.
      Two readings were considered and both refused as invention: (a) an exclusivity claim — "the
      pusher is in exactly one mode at a time" — which the clause does not state; (b) a completeness
      claim — "no fourth mode exists" — which Q-15 has already ruled on by making hand/jog a facility
      within manual rather than a mode.
    destinations: [REQ-034, REQ-035, REQ-036, REQ-037, REQ-038]
    destination_status: "ALL ENUMERATED IN THIS ARTIFACT"
    what_would_change_it: "A ruling that mode selection is exclusive, or that an out-of-range mode value has a defined behaviour. Either yields assertions; neither is stated today."

  - clause: REQ-053
    title: "Fault: pusher blocked"
    text: "Too many pusher high pressures in one cycle (pusher blocked) is a fault, annunciated on the display."
    why: >-
      Both limbs live elsewhere. The RAISE limb is REQ-048's own Text and is enumerated as REQ-048 A2
      and A3; restating it here would put two assertions with one shared defect into the denominator,
      which inflates it without adding a falsifiable claim. The DISPLAY limb is out of subject.
    destinations:
      raise_limb: "REQ-048 A2 / A3 — IN THIS ARTIFACT, ENUMERATED"
      display_limb: "an HMI / text-display enumeration — *** DOES NOT EXIST. THIS IS A GAP, NOT AN EXCLUSION. ***"

partially_mined:
