    No corpus norm exists (§7 open item 4). Reported, never judged. *** THE COMPARISON A READER WILL
    MAKE ANYWAY IS TO THE HOPPER SET AT 3.38, AND 1.79 IS HALF OF IT — SO HERE IS THE REASON RATHER
    THAN A DEFENCE. *** That register is ONE behaviour re-decomposed over five issues under thirteen
    rulings, so its clauses are long and multi-limbed. This register took a restricted document that had
    ALREADY separated each sequence step onto its own line and gave each line its own REQ — REQ-009 IS
    a delay and REQ-010 IS the start that follows it. The clause granularity is finer, so the per-clause
    count is lower, and the two numbers are not measuring the same thing (J3). The pusher lane, working
    the same register under a different subject, independently landed at 1.76 — which is the more
    meaningful comparison and it is close. Three data points are still not a norm.
  shape_check: >-
    What would be the real warning sign is the SHAPE of the distribution, not its mean, because attack
    2 is splitting the easy clauses finely and leaving the hard one whole. Reported: the four largest
    clauses here are REQ-013 (3), REQ-016 (3), REQ-027 (3) and REQ-028 (4) — recovery, re-entry,
    restart-inhibit and the counting window. Those are the hard ones, which is the opposite of attack 2.

