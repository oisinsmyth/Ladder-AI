ambiguities_open:

  - id: AMB-SEQ-03
    severity: HIGH
    kind: "*** THE NEAREST THING TO AN INTERNAL CONTRADICTION IN THIS REGISTER — REQ-027 versus Q-01 / doc 06 C-128. ***"
    what: >-
      Q-01's recorded resolution states, without qualification: 'A fresh, explicit start command always
      re-runs the FULL start-up sequence from the top; NO MID-SEQUENCE RESUME.' REQ-027 requires
      precisely a mid-sequence resume — 'the startup sequence resumes from point 5'.
    why_it_is_probably_not_a_true_contradiction: >-
      C-128's sentence is about what a fresh START COMMAND does, and REQ-027's resume is not triggered
      by a start command. Q-08's wording even leaves room for it: 'unless there is a documented
      exception', and REQ-027 is a documented exception.
    why_it_still_has_to_be_raised: >-
      The SCOPE of 'no mid-sequence resume' is stated nowhere. Read narrowly (start commands only)
      REQ-027 stands and its three assertions are correct. Read broadly (this sequencer never resumes
      mid-sequence, full stop) REQ-027 is disarmed and three assertions here are wrong.
    what_i_did: >-
      *** I DID NOT PICK A READING. *** REQ-027's assertions take its own words verbatim. If the broad
      reading is ruled, REQ-027 A1/A2/A3 are REMOVED rather than reworded, so the cost is three fewer
      units and no dangled citation.
    who_must_rule: "the gate-1 architecture signer"

  - id: AMB-SEQ-07
    severity: HIGH
    kind: "An ordering the register never states, between two clauses that both fire on the same event."
    clause: "REQ-026 / REQ-027 versus REQ-028"
    what: >-
      *** WHAT HAPPENS ON THE FIFTH OVERCURRENT EVENT IS UNSTATED, AND THE TWO ANSWERS DIFFER BY ONE
      REVERSAL OF A BLOCKED MACHINE. *** REQ-023…027 say every overcurrent event stops the plant,
      pauses 4 s and resumes via a reverse run. REQ-028 says the fifth stops the system and alarms.
      The register never says whether the fifth event does both — pause, reverse, then trip — or trips
      immediately instead of recovering.
    why_it_matters_to_the_denominator: >-
      REQ-027 A1's trigger as written ('the specified pause has elapsed after an overcurrent stop')
      covers the fifth event too, so as it stands this enumeration asserts that the fifth event DOES
      reverse. That is a reading, and it is recorded here rather than buried inside a trigger.
    would_settle_it: "One clause in REQ-028 saying whether the trip pre-empts the recovery."
    who_must_rule: "the gate-1 architecture signer"

  - id: AMB-SEQ-08
    severity: MEDIUM-HIGH
    kind: "Two source documents counting two different things, with the settings named after the wrong one."
    clause: "REQ-005 versus REQ-028"
    what: >-
      *** DOES THE START SEQUENCE'S OWN REVERSE RUN COUNT AS A REVERSAL? *** REQ-005 makes a reverse
      run a normal part of every start. REQ-028 counts 'overcurrent events', but the SpecSheet phrasing
      the register quotes counts reversals ('if shredder reverses 5 times within 3 minutes'), and both
      settings are named for reversals, not overcurrents.
    why_it_matters: >-
      If start-sequence reverses count, a plant started and stopped a few times inside three minutes
      trips on nothing at all. If they do not, the two source phrasings disagree and the register's own
      precedence rule (FuncDesc primary) resolves it toward overcurrent events.
    what_i_did: >-
      Wrote 'overcurrent events' into REQ-028's assertion texts, per the register's own stated
      precedence, and raised this rather than resolving it silently.

  - id: AMB-SEQ-01
    severity: HIGH
    kind: "An assertion resting on a presupposition rather than on a stated claim."
    clause: REQ-016
    what: >-
      REQ-016 A3 (upstream de-asserts when the infeed stops on hopper high) rests on the presupposition
      carried by REQ-016's own word 're-enabled'. NO CLAUSE STATES IT OUTRIGHT.
    what_i_did: >-
      Enumerated it, and flagged it here. Omitting it makes the operationally worst defect in that
      recovery path — upstream feeding a stopped belt — uncatchable while every other assertion reads
      green, which is §1.4's exact failure mode. A reader may judge this an inference too far. If it is
      ruled out the assertion is REMOVED and the count falls to 42.
    who_must_rule: "the gate-1 architecture signer"

  - id: AMB-SEQ-02
    severity: MEDIUM
    kind: "Two observables inside one NEVER."
    clause: REQ-027
    what: >-
      REQ-027 A3 names two observables in one sentence. The single claim is 'the steps before the
      reverse-run step are not repeated'; the two named observables are how a repeat would show. They
      are not separable — a defect that re-enters at the top produces BOTH, and no plausible defect
      produces one alone.
    what_i_did: "Kept it as one assertion and declared the judgement. If a reader disagrees, the repair is to SPLIT into two (count 44), never to drop the claim."

  - id: AMB-SEQ-10
    severity: MEDIUM
    kind: "A trigger with no stated persistence, against a floor that says one-scan events are unobservable."
    clause: REQ-013
    what: >-
      'Loss of downstream available' states no minimum duration. A one-scan dropout is structurally
      unobservable (contract §4.1) and it is unstated whether it must stop the plant at all. REQ-013's
      assertions say 'goes false', taking the clause verbatim, which means a vector cannot distinguish
      a correct filter from a missing one.
    would_settle_it: "A debounce ruling, which would also decide whether REQ-002 A1 needs one."

  - id: AMB-SEQ-04
    severity: MEDIUM
    kind: "A hole named because it is invisible from the assertion list."
    clause: "REQ-012 and REQ-013"
    what: >-
      Whether DQ9_SYS_EnableUpstream must drop when 'all equipment' stops is unstated, so it is
      excluded from `plant_equipment_run_outputs` and NO assertion currently requires it. *** MEANING A
      PLANT THAT STOPS EVERYTHING WHILE STILL TELLING UPSTREAM TO FEED PASSES EVERY ASSERTION IN THIS
      FILE. *** Named so the hole is visible rather than assumed covered.

  - id: AMB-SEQ-05
    severity: MEDIUM
    kind: "A conflict visible only from the plant-cycle side."
    clause: "REQ-012 / REQ-013 versus REQ-030 / REQ-031"
    what: >-
      The pusher power pack is excluded from the stop set. REQ-031's run-on and REQ-030's
      prior-and-during rule mean a stop-all that cuts the power pack may conflict with parking the ram.
      The register does not reconcile them. Pusher-subject, and the pusher lane raised the mirror image
      of this as its own AMB-PSH-03 ('stops' has no defined meaning for a ram mid-stroke) — *** TWO
      INDEPENDENT ENUMERATORS REACHED THE SAME HOLE FROM OPPOSITE SIDES, WHICH IS THE STRONGEST
      EVIDENCE AVAILABLE THAT IT IS REAL. ***

  - id: AMB-SEQ-06
    severity: MEDIUM
    kind: "A declared instance boundary that a citation could dispute."
    clause: REQ-063
    what: >-
      The pusher power pack is a fifth motor with a running feedback (DI11_PSH_PowerPackRunning) and is
      NOT in this clause's declared instance set. Declared OUT with a destination rather than left
      ambiguous, because an undeclared instance a citation names is a FINDING, not a new unit (R4). Its
      supervision is conditioned by REQ-043 ('does not look for pusher switch feedback' when disabled)
      and belongs to the pusher subject.

  - id: AMB-SEQ-09
    severity: LOW
    kind: "A METHOD observation, raised rather than adopted."
    what: >-
      §1.2a's two bound kinds are both about sampled-value staleness and neither describes a
      sequencer's bounds. Three kinds were used here and written into every assertion's sentence. Raised
      as a method question — whether the definition should carry a sequencer vocabulary — rather than
      adopted as a general rule by an enumerator.

