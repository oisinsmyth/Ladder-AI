decomposition_judgements_declared:
  - id: J1
    what: "A LOWER-BOUND ASSERTION IS WRITTEN WHEREVER A CLAUSE STATES A DELAY AS AN ORDERING PRECONDITION — BUT NOT WHERE THE BOUND IS MERELY A RESPONSE'S DURATION."
    why: >-
      R3 says a bound qualifies a response rather than splitting it, and that is right where the only
      defect is a wrong number. It is NOT right where the response can arrive EARLY: an arrival
      assertion is satisfied MORE easily by an under-scaled preset, not less. The hopper enumeration
      hit exactly this at its fifth issue and it took a vector author to find it. So REQ-003, REQ-006,
      REQ-009, REQ-011, REQ-015, REQ-016 and REQ-026 each carry a 'does not happen before' limb as its
      own assertion, with the under-scaled preset named as the isolating defect. The line is
      spec-derived rather than a taste: where the clause states the delay as a PRECONDITION for the
      next action ('3 s after', '5 s delay follows ... before', 'pauses for 8 s before'), both limbs
      exist; where the number is simply how long a response is held (REQ-005's 6 s reverse run), R3
      holds and there is ONE assertion. This is the single largest contributor to the count.
  - id: J2
    what: "AN ORDERING PROHIBITION IS WRITTEN AS `NEVER`, NOT AS A SAMPLED `WHEN`."
    why: >-
      A sequencer's most valuable assertions are about what must not happen out of order, and an early
      event has no trigger to hang a WHEN on. Writing one as a WHEN would be declaring a form that
      makes the assertion easier to verify than it is — F-3's hole, and gate 3e compares every
      citation's declared form against what this file states. Sixteen of the 43 are NEVER and each is
      the form the clause ASSERTS, not the form convenient to a verifier.
  - id: J3
    what: "EACH CLAUSE IS DECOMPOSED FROM ITS OWN TEXT, EVEN WHERE TWO CLAUSES DESCRIBE ONE STEP."
    why: >-
      The register's source document had already separated each sequence step onto its own line, and
      the register gave each line its own REQ — REQ-009 IS the delay and REQ-010 IS the start that
      follows it. So the delay's lower-bound limb lives under REQ-009 and the arrival under REQ-010,
      rather than both being pulled into one clause. That is why the assertions-per-clause ratio here
      is low; see `ratios`.
  - id: J4
    what: "THE NEGATIVE CASE IS WRITTEN ONLY WHERE THE SPEC STATES ONE."
    why: >-
      R1 calls the negative case the one most often lost, and says to write it WHERE THE SPEC STATES
      ONE. REQ-001 states no negative, so no 'never self-starts' assertion was invented under it —
      REQ-062 and Q-08 state that obligation and it is enumerated there, under REQ-062 A1/A3 and
      REQ-013 A3. Inventing it under REQ-001 as well would have put three assertions with one shared
      defect into the denominator.

