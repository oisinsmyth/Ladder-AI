bounds:
  pre_start_sounder_time:            "10 s"
  discharge_conveyor_timeout:        "10 s"
  shredder_reverse_run_time:         "6 s"
  shredder_spin_down_pause:          "8 s"
  infeed_restart_delay:              "5 s"
  infeed_to_upstream_enable_delay:   "3 s"
  reversal_retry_pause_time:         "4 s"
  reversal_count_threshold:          "5 overcurrent events"
  reversal_window_time:              "180 s (3 minutes)"
  motor_run_confirm_time:            "*** UNSPECIFIED for three of REQ-063's four declared instances ***"

bounds_kind_vocabulary: >-
  §1.2a names two bound kinds — maximum age and update cadence — and both are about the staleness of a
  SAMPLED value. Neither describes a sequencer's bounds, which are step durations and step
  precedences. Rather than leave the kind ambiguous, which §1.2a forbids, three kinds are used here
  and the kind is written into every assertion's own sentence: DURATION-OF-RESPONSE ('is asserted FOR
  the specified ...'), MINIMUM-ELAPSED-BEFORE ('NEVER ... less than the specified ... after ...'), and
  MAXIMUM-ELAPSED-UNTIL (a confirm window). Raised as AMB-SEQ-09 as a method question, not adopted as
  a general rule.

bounds_provenance:
  pre_start_sounder_time:          "SPEC-STATED. FuncDesc §Start sequence — 'Sound pre-start siren (10s)'. Start value 10.0 matches. Kind: DURATION-OF-RESPONSE for REQ-003 A1 and MINIMUM-ELAPSED-BEFORE for REQ-003 A2, which is why both limbs exist."
  discharge_conveyor_timeout:      "*** NO SPEC NUMBER. *** The register says the confirm-window duration 'is not stated in either source'; 10 s is a site-practice default signed off by the owner 2026-07-16 (fix-wave-1 §1, Q-02). Kind: MAXIMUM-ELAPSED-UNTIL. Legitimate spec-side provenance, but a signed default rather than a restricted figure, and a citing vector must record it via boundsUsed."
  shredder_reverse_run_time:       "SPEC-STATED. FuncDesc §Start sequence — 'Start shredder reverse, run for 6s'. Start value 6.0 matches. Kind: DURATION-OF-RESPONSE."
  shredder_spin_down_pause:        "SPEC-STATED. FuncDesc §Start sequence — 'Stop shredder, pause for 8s'. *** NO DB_Settings MEMBER EXISTS *** — the register says so itself beneath its Settings table. Q-09 located a home for the value; that location is implementation and is fenced out of every assertion text. The NUMBER is REQ-006's own. Kind: MINIMUM-ELAPSED-BEFORE."
  infeed_restart_delay:            "SPEC-STATED. FuncDesc — 'Time delay 5s' (REQ-009) and 'Delay 5s' (REQ-015). Start value 5.0 matches. One number in the source, presumed one setting — the register's own words. Kind: MINIMUM-ELAPSED-BEFORE."
  infeed_to_upstream_enable_delay: "SPEC-STATED and owner-confirmed. Q-07 RESOLVED 2026-07-17 ('Confirm'), holding 3 s over the SpecSheet's conflated 6 s narrative. Kind: MINIMUM-ELAPSED-BEFORE."
  reversal_retry_pause_time:       "SPEC-STATED. FuncDesc §Shredder Overcurrent Control — 'Pause for 4s'. Start value 4.0 matches. Kind: MINIMUM-ELAPSED-BEFORE."
  reversal_count_threshold:        "SPEC-STATED. 'If 5 overcurrent events occur in 3 minutes'. Kind: a COUNT within a scope, not a duration; the scope is the load-bearing half and it is the re-arming window below."
  reversal_window_time:            "SPEC-STATED, with its SEMANTICS owner-ruled 2026-07-17 (owner-questions B-5): RE-ARMING, not fixed-from-first. Every reversal restarts the 180 s clock; the count clears only after a full clean 180 s. Kind: MINIMUM-ELAPSED-BEFORE, re-arming. REQ-028 A3 and A4 are the two halves of that ruling."
  motor_run_confirm_time:          "*** NO BOUND FOR THREE OF FOUR INSTANCES. *** REQ-063 says 'after a preset time' and routes the question to Q-02, whose resolution covers five settings, none of which is a shredder or infeed run-confirm timeout. Only discharge_conveyor_timeout exists. Per §1.2a the honest output is THE CLAUSE STATES NO BOUND for the other three, and no plausible number is supplied here. See FINDING-3."

bounds_not_derived_from_any_apparatus: >-
  §1.2a's second rule, checked explicitly. No bound above was corroborated against a round-trip
  latency, a poll interval, or anything a test rig measured. Every one comes from the register's own
  text or its recorded owner rulings, and the one that rests on a commissioning sign-off rather than a
  restricted figure says so. A retune of discharge_conveyor_timeout changes REQ-063 A1's truth condition
  on one instance while moving zero IDs — which is AMB-19, and the bounds-currency gate is what
  catches it.

