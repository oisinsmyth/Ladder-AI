# ---------------------------------------------------------------------------------------------------
# THE SUBJECT (§1.4). A citation for another component must FAIL TO JOIN rather than silently succeed.
# ---------------------------------------------------------------------------------------------------
subject: shredder-plant-cycle
subject_long: >-
  The shredder plant-cycle sequencer of test-project001 — the single stepped sequence that starts the
  plant (pre-start warning, discharge conveyor, shredder reverse and forward, hopper gate, infeed,
  upstream enable), stops it, gates the infeed on hopper level, recovers it from an overcurrent event,
  trips it on repeated overcurrents, and governs what may run again after an E-stop or a power cycle.
subject_determined_from: >-
  *** THE REGISTER'S OWN SEQUENCE-CLASSIFICATION TABLE, NOT FROM ANY ARCHITECTURE ARTIFACT. *** The
  register's "Sequence classification (C-113 memory test)" table, row 1, names this set verbatim:
  "Shredder plant cycle (REQ-001…016, 023–028, 062–063)". That table is explicitly "a classification
  of the requirement, not a design", it is spec-side, and it is exhaustive over the register. I was
  given a BLOCK NAME by my dispatch and may not open the block to learn its extent, so the register's
  own statement of which requirements form this stepped sequence is the only honest boundary
  available. No block name is used to define the subject and none appears in any assertion text.
subject_is_not: >-
  This enumeration is NOT the denominator for the pusher cycle, for fault annunciation or the text
  display, for the overcurrent DETECTION chain, for the HMI/indication layer, or for the in-cycle
  lamp. A coverage figure for any of those measured against this denominator answers a different
  question (§1.4's measured failure). A citation naming a clause outside `gate_projection_template.
  clauses` must fail to join.

