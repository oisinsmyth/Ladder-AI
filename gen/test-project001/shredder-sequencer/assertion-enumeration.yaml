instance_declaration:
  scope: "class-level (`instances: []`) for every clause EXCEPT REQ-063, which declares four"
  why_not_the_instance_axis_for_012_013_028: >-
    R4's worked example is 'each of the three feeders' — N instances of ONE class. REQ-012/013/028 say
    'all equipment' / 'the system stops', and the four run outputs are HETEROGENEOUS equipment, not
    instances of a class. Worse, each of those clauses carries a limb ('at the same time') that is
    inherently CROSS-equipment and could not live on an instance-qualified unit. So the multi-output
    obligation sits inside ONE assertion naming every output, with the four carried in
    `also_requires_observation_of` — which is what stops a vector observing one output and passing.
  why_the_instance_axis_is_used_for_063: >-
    Its text says 'if ANY motor fails to run' — genuinely N instances of one class, and the clause's
    single assertion is per-motor.
  standing_condition: >-
    *** IF THIS SEQUENCE IS EVER INSTANTIATED MORE THAN ONCE (a second shredder line), EVERY
    `instances: []` HERE IS WRONG AND MUST BE RE-DECLARED BY AN ENUMERATOR. *** A citation naming an
    undeclared instance is a FINDING (R4), never a new unit.

