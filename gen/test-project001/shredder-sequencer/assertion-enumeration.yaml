not_decomposable: []

refusals_and_findings:
  - id: REFUSAL-1
    clause: REQ-063
    severity: MEDIUM
    limb: "'the fault sequence occurs'"
    refusal: "*** NOT DECOMPOSED. NOT SOFTENED INTO A VAGUE ASSERTION TO FILL A ROW. ***"
    why: >-
      'The fault sequence' is a DEFINITE reference to something the register never defines. It appears
      nowhere else — no clause, no section, no glossary entry and no owner ruling says what a fault
      sequence consists of. It is not a synonym for the stop, because the clause names the stop
      separately in the same sentence, right after it. Any assertion I wrote for it would be my
      invention of a behaviour wearing a REQ id, which is precisely how a denominator stops being
      spec-derived.
    what_would_settle_it: >-
      One clause defining the fault sequence, or a ruling that the phrase is rhetorical and the
      clause's only obligations are the stop (enumerated as REQ-063 A1) and REQ-057's annunciation.
      Either answer costs nothing; the current state is a requirement nobody can test.
    consequence_if_ruled_substantive: "At least one new assertion PER INSTANCE — new UNCLASSIFIED units and their own reported event (§2.3), never absorbed as a classification change."

  - id: REFUSAL-2
    clause: REQ-029
    severity: LOW-MEDIUM
    status: "OUT OF SUBJECT here. Recorded because it is the out-of-subject clause most likely to be ruled back in — it is the one that LOOKS like a sequencer step."
    limb: "'Overcurrent is ignored for approximately 2–3 s at shredder startup'"
    refusal: "NO BOUND WRITTEN. If this clause is ruled in-subject it must be re-worded before it can be enumerated."
    why: >-
      Two defects in one bound. It is a RANGE ('2–3 s') and it is hedged ('approximately'), so there is
      no value an assertion can be written against — a 2.9 s window and a 3.4 s window are
      indistinguishable under it. And §1.2a requires a bound to state its KIND; this one does not. The
      register's Settings table resolves the value to 3.0 'within the stated range', which is a
      commissioning choice, not a specification. Writing 3 s into an assertion would promote a start
      value into a requirement.
    what_would_settle_it: "A single specified number with its kind, in the clause."

  - id: FINDING-2
    severity: HIGH
    scope: "register-wide; bites REQ-028 A2 in this enumeration"
    what: >-
      *** THE REGISTER NAMES NO TAG FOR ANY ANNUNCIATION BIT. *** REQ-028 and REQ-052…059 all say an
      annunciation bit 'exists (grep-verified)' and not one of them says what it is called. The only
      names live inside the design, which R5 forbids the enumerator to use and which I did not go
      looking for.
    consequence: >-
      REQ-028 A2 is enumerated with `response_signal: UNNAMED_IN_REGISTER` and CANNOT satisfy the
      response-signal check. Every assertion in the not-yet-existing fault-annunciation enumeration
      will hit the same wall. This is not a decomposition problem — the assertion is perfectly
      falsifiable — it is a register gap that makes a whole class of assertion uncitable.
    what_must_not_happen: >-
      A vector author must NOT invent or look up a name to make the citation work. *** THE REPAIR IS
      TO THE REGISTER OR THE HARNESS BINDING, NEVER TO THIS FILE. *** An enumerator inventing an
      alarm-bit name would be breaking hard rule 3 to make a citation go green, which is the request
      this role exists to refuse.
    what_would_settle_it: "The register's equipment inventory gains an annunciation row per alarm, the way it already has one per physical IO point."

  - id: FINDING-3
    severity: HIGH
    clause: REQ-063
    what: >-
      *** THE 'PRESET TIME' EXISTS FOR ONE OF FOUR MOTORS. *** The Settings table carries
      DischargeConveyorTimeout = 10.0 and nothing whatever for the infeed or for either shredder
      direction. REQ-063's Notes route the question to Q-02, and Q-02's resolution covers five
      settings, none of which is a shredder or infeed run-confirm timeout.
    consequence: >-
      Three of REQ-063's four declared coverage units have no bound to be tested against. Per §1.2a no
      number was supplied here; the assertion says 'the specified motor run-confirm time' and the
      bounds table says UNSPECIFIED for those three.
    why_it_is_not_merely_untidy: >-
      This is the clause that stops the plant when a motor does not start. Without a preset the
      obligation has no failure point, so an implementation that waits forever satisfies it vacuously
      — and REQ-057's 'identify which motor' compounds it, being itself marked proposed.
    what_would_settle_it: "Three numbers, or one ruling that a single shared confirm window applies to all four."

