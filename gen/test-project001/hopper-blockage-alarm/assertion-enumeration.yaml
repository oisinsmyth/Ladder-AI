ambiguities_open:
  # NEW at issue 2. Raised, not absorbed. None was guessed into an assertion.

  - id: AMB-09
    severity: medium
    created_by: AR-HBA-05
    clause: REQ-HBA-005
    what: >-
      AR-HBA-05 says a reset with the blockage still live yields an alarm that "drops **(if at all)** for
      essentially one evaluation and is asserted again". The parenthesis declines to say whether the alarm
      is observably de-asserted AT ALL. So a vector cannot know whether observing "the alarm never went
      low" is a PASS or a FAIL for A3, and A5's single-evaluation claim may be unobservable by
      construction rather than by instrumentation.
    would_settle_it: >-
      A ruling on whether a momentary de-assert on reset is REQUIRED, FORBIDDEN, or DON'T-CARE. A3 and A5
      are worded not to require one; if the answer is "required", both re-hash.

  - id: AMB-10
    severity: high
    created_by: "AR-HBA-05 meeting Q-HBA-04"
    clause: "REQ-HBA-005 vs REQ-HBA-001"
    what: >-
      *** WHAT IS "THE BLOCKAGE CONDITION" THAT RE-RAISES THE ALARM? *** AR-HBA-05 says the condition is
      re-evaluated on reset and the alarm re-raises if "accumulated persistence time still at or past the
      threshold" — the accumulator ALONE. REQ-HBA-001's raise condition is cumulative high-AND-RUNNING
      time reaching the threshold, and Q-HBA-04 gates on the run state. Consider the realistic sequence:
      the operator STOPS the plant, then presses reset, with the hopper still high and the accumulator
      frozen at or past threshold. Accumulator-alone says the alarm re-raises immediately. Raise-condition
      says it does not, because the plant is not running. Both readings are supported by the register and
      they are observably different on the most likely operator sequence there is.
    consequence: >-
      REQ-HBA-005 A3 is worded to the ACCUMULATOR reading, because that is AR-HBA-05's own wording. If the
      run-gated reading is correct, A3 re-hashes and a vector written against it tests the wrong thing.
    would_settle_it: "A ruling on whether the re-raise evaluation is run-state-gated. This is the one to settle before REQ-HBA-005 vectors are written."

  - id: AMB-11
    severity: low
    created_by: AR-HBA-06
    clause: "NEW-HBA-01 as narrowed"
    what: >-
      AR-HBA-06 narrows the freeze to "while the plant is stopped **and the hopper is still reading
      high**". That leaves one state uncovered: plant stopped, hopper reading false, but for LESS than the
      filter time — not yet a debounced clear, and no longer inside the freeze's stated scope. Does the
      accumulator freeze, hold, or accrue there? Almost certainly freeze, but the narrowed wording
      literally excludes it, and "almost certainly" is what an enumerator is not allowed to write down.
    would_settle_it: "One word in AR-HBA-06's scope sentence — e.g. the freeze applies whenever the plant is stopped and no debounced clear has completed."

