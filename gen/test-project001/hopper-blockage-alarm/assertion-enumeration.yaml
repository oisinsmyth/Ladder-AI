# ===================================================================================================
# THE FIFTH-COLLISION SEARCH — *** RESULT: NONE FOUND. STATED, NOT INFERRED FROM SILENCE. ***
# ===================================================================================================
fifth_collision_search:
  method: >-
    REQ-HBA-008 was read against every other clause and every ruling, in both directions, on the standing
    evidence that four consecutive rounds each produced a collision invisible clause-by-clause. A new,
    unexercised, GENERAL clause that reaches every transition in the register is the highest-risk object
    this register has yet contained, so it was checked against each transition individually rather than
    as a whole.
  result: "*** NO FIFTH REQUIREMENT-LEVEL COLLISION. *** The trend holds: 8 -> 3 -> 2 -> 1 -> 0."
  checked_and_clean:
    - "REQ-HBA-008 x AR-HBA-08 — the collision the register found and closed in place. Confirmed not reopened: both new assertions are SIMULTANEITY claims, so a shared transient satisfies them and no citing vector is pushed into asserting on the drop."
    - "REQ-HBA-008 x REQ-HBA-006 — a debounced clear drops the ACCUMULATOR, not the LATCH, so neither output moves. The case that most looks like it should disturb the tracking relation does not."
    - "REQ-HBA-008 x REQ-HBA-007 power-up — both outputs RETAIN, both survive. A retentivity MISMATCH between them violates 008.A1 and 007.A3 alike; caught twice, contradicted nowhere."
    - "REQ-HBA-008 x AR-HBA-10's window — the inhibit's return falls out of 008.A1 with no special case, which is exactly what AR-HBA-12 chose a general clause to achieve. AMB-13 is fully closed."
    - "REQ-HBA-008 x REQ-HBA-004 — the inhibit inherits the latch discipline by tracking; no contradiction, no duplication (004 is about WHEN the alarm may fall, 008 about the two agreeing)."
    - "REQ-HBA-008 x Q-HBA-05 — 'tracks' is not 'is the same bit'. The `response_signal:` field on both assertions names `HopperBlockedInhibit`, so the independent-routing requirement is enforced mechanically and not merely asserted in prose."
    - "AR-HBA-11's rewording — checked that 005.A5's text already matched, and that nothing else in the enumeration depended on same-scan sequencing. Zero re-hashes, confirmed by comparison."
    - "The bounds table and the signal-name property survive their hardest case: REQ-HBA-008 is entirely about two named outputs and names neither in hashed text."
  what_was_found_instead: >-
    One item, and it is NOT a collision between rulings — it is a limit in the ENUMERATION FORMAT, exposed
    by the first RELATIONAL assertion this corpus has produced. Raised as AMB-14, not absorbed. The
    distinction matters for the trend the coordinator is tracking: the register converged; the artifact
    format met a case it was not built for.

