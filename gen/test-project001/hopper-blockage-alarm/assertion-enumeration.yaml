# AMBIGUITIES
# ===================================================================================================
ambiguities_closed_since_issue_2:
  AMB-09: "CLOSED by AR-HBA-08 — DON'T-CARE while the condition holds, REQUIRED-observable once cleared. Moved 005.A1/A2/A3/A5."
  AMB-10: "CLOSED by AR-HBA-07 — the re-raise keys on the accumulator alone. Produced 005.A6."
  AMB-11: "CLOSED by AR-HBA-09 — below the filter time, the freeze applies. Produced 003.A4."

ambiguities_open:

  - id: AMB-12
    severity: medium
    kind: "*** THE THIRD COMBINATION-ONLY FINDING — RAISED, NOT ABSORBED, AS INSTRUCTED. ***"
    clause: "AR-HBA-05 vs AR-HBA-08"
    what: >-
      AR-HBA-05 still states raise-dominance as a behavioural requirement in the present tense: "If a reset
      and a satisfied raise condition coincide in the same evaluation, the raise wins and **the alarm ends
      that evaluation asserted**." AR-HBA-08 then rules that the only thing distinguishing that outcome —
      whether the alarm went momentarily false — is **DON'T-CARE**, on the express grounds that asserting on
      it would force a `Coincidence` "to test something with no operational consequence". *** SO THE
      REGISTER STATES A REQUIREMENT AND THEN RULES ITS ONLY OBSERVABLE UNTESTABLE. *** Under §1 an assertion
      must be falsifiable, so no assertion can carry AR-HBA-05's literal same-evaluation claim. 005.A5 is
      therefore worded to the consequence that IS falsifiable and operationally real — a reset coincident
      with the threshold crossing permanently suppressing the alarm — and AR-HBA-05's same-evaluation
      sentence is covered by NOTHING.
    why_this_is_the_same_shape_as_findings_1_and_2: >-
      Invisible clause-by-clause: AR-HBA-05 reads fine alone, AR-HBA-08 reads fine alone. It appears only in
      combination, and it leaves an unretracted second source stating a requirement that the enumeration
      cannot cover — the same failure the consistency pass fixed twice already.
    would_settle_it: >-
      Either (a) amend AR-HBA-05's sentence to state the observable consequence rather than the
      same-evaluation outcome, in which case 005.A5's current text already matches and nothing re-hashes; or
      (b) scope AR-HBA-08's DON'T-CARE to exclude the coincident-crossing case, in which case 005.A5 needs a
      SIXTH sibling in `Coincidence` form and the denominator rises to 24.
    do_not_resolve_by: "Deleting 005.A5. Its defect — a permanently suppressed live fault — is the most serious in this register and nothing else catches it."

  - id: AMB-13
    severity: low
    clause: REQ-HBA-007
    created_by: AR-HBA-10
    what: >-
      AR-HBA-10's accepted window releases BOTH outputs: the reset clears the alarm and, by REQ-HBA-005, the
      inhibit with it. The clause text then makes only the ALARM's return assertable ("it re-raises WITHIN
      one further persistence threshold"). It says nothing about `HopperBlockedInhibit` returning. So the
      operationally significant half of the window — **the plant is released to run on a still-blocked
      hopper for up to one threshold** — has an assertion for the annunciation coming back and none for the
      stop demand coming back.
    what_i_did: >-
      Did NOT add one. REQ-HBA-001 A2 already claims the inhibit follows the raise trigger, and asserting a
      second inhibit response here would be inventing a requirement the clause does not state. Recorded
      instead.
    would_settle_it: >-
      One clause: whether `HopperBlockedInhibit` is required to return with the alarm inside the AR-HBA-10
      window. If yes, REQ-HBA-007 gains a sixth assertion and the denominator is 24.

checked_and_found_clean:
