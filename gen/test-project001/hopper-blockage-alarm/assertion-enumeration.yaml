# ===================================================================================================
# NOT MINE TO ASSIGN
# ===================================================================================================
buckets_not_assigned_here: >-
  OUT-OF-SCOPE and UNTESTABLE-ON-RIG belong to whoever signs off the architecture at gate 1 (§4.3) —
  never to the block's author, never to a vector's author, and not to the enumerator either. DEFERRED
  needs an owner and a date. UNCLASSIFIED is never written: it is
  enumerated - (COVERED u OUT-OF-SCOPE u DEFERRED u UNTESTABLE-ON-RIG), computed across two artifacts.
  *** THE TWO NEW ASSERTIONS ARE UNCLASSIFIED UNTIL SOMEBODY RULES ON THEM — that is §2.3's event, and
  the gate should fail until it happens. ***
