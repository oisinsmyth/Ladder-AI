clauses:

  # =================================================================================================
  REQ-HBA-001:
    title: Continuous-high blockage alarm
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the hopper-blockage alarm is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the hopper-blockage alarm is asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The alarm output is never asserted, or is asserted from a condition other than the elapsed
          persistence window, while the inhibit output still asserts correctly at the same trigger. A2, A3
          and A4 stay true.
        text_unchanged_since_issue: 2

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the inhibit/stop demand output is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the inhibit/stop demand output is asserted"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output is left unwritten, or driven from a different condition, while the alarm
          output asserts correctly. R2 — one trigger, two responses. A1, A3 and A4 stay true.
        text_unchanged_since_issue: 2

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true and no hopper-blockage alarm was previously latched THEN the hopper-blockage alarm is not asserted"
        normalised_text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true and no hopper-blockage alarm was previously latched THEN the hopper-blockage alarm is not asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The run-state gate on ACCRUAL is absent, so persistence time accrues at standstill and a full
          hopper at rest earns an alarm it never earned — Q-HBA-04's own worked case. A1, A2 and A4 stay
          true: the running case still behaves.
        rule: "R1 — the trigger's NEGATIVE case."
        text_changed_from: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true THEN the hopper-blockage alarm is not asserted"
        why_reworded: >-
          *** THIS IS THE ASSERTION THE Q-HBA-04 RECONCILIATION MOVES, AND IT IS THE ONLY ONE. *** Under
          AR-HBA-07 `PlantRunning` gates ACCRUAL, not raising and not re-raising — so an alarm EARNED while
          running and then carried into a standstill is legitimately asserted at standstill (REQ-HBA-004).
          Issue 2's text said the alarm is not asserted at standstill FULL STOP, which is now FALSE for
          that case. The precondition "and no hopper-blockage alarm was previously latched" restores it to
          a claim about accrual, which is what Q-HBA-04's first clause is explicitly about. See
          `conditional_on_owner:` for what happens if the owner meant the strong reading.

      - ordinal: A4
        form: When
        text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        normalised_text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RESET-ON-STOP DEFECT. *** The elapsed persistence time is DISCARDED on loss of running
          rather than FROZEN, so an interrupted run never reaches the threshold and a genuinely blocked
          hopper never alarms. A1 stays true — the uninterrupted run still alarms.
        text_unchanged_since_issue: 2
        not_split_further: >-
          No paired inhibit assertion for this trigger. The only defect that would break the inhibit in the
          INTERRUPTED case while leaving it correct in the uninterrupted case is describable solely in terms
          of how the two outputs are computed — R5 forbids that split. A2 carries the claim that the inhibit
          follows the same trigger.

  # =================================================================================================
  REQ-HBA-002:
    title: No alarm below threshold
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false and stays continuously false for at least the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is not raised for that high episode"
        normalised_text: "WHEN Hopper_Level_High goes false and stays continuously false for at least the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is not raised for that high episode"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The clear is not honoured at all — the accumulator ignores hopper-low entirely — so an episode
          that visibly cleared still alarms. A2 stays true.
        text_unchanged_since_issue: 2

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is still raised for that high episode"
        normalised_text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is still raised for that high episode"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The clear debounce is absent, so any glitch to false counts as a clear and prevents the alarm — a
          genuinely blocked hopper with a chattering sensor never alarms. A1 stays true.
        text_unchanged_since_issue: 2

  # =================================================================================================
  REQ-HBA-003:
    title: Momentary clear re-arms the window
    instances: []
    decomposition_shape: >-
      *** A 2x2 OVER (debounced clear | brief false) x (plant running | plant stopped), AND EACH CELL WAS
      SEPARATELY RULED. *** Q-HBA-02 gave the debounced/brief axis; AR-HBA-06 gave the stopped case of the
      debounced route; AR-HBA-09 gave the stopped case of the brief route, which had been an outright gap.
      Each cell has its own isolating defect, so under §2.2-as-corrected each is its own assertion. Leaving
      the fourth cell inside another assertion would re-absorb the gap AR-HBA-09 exists to close.
    premise_relied_on: >-
      AR-HBA-09 states that the clear-debounce filter runs IRRESPECTIVE of `PlantRunning`. A3 and A4 are
      unreachable without it — a debounced clear could never be established while stopped. Previously
      implied only; now explicit, and recorded here as the premise those two assertions stand on.
    note_on_form: >-
      As written this clause asserts an INTERNAL STATE TRANSITION ("discards the accumulated persistence
      time"), which is not an observable response. All four assertions restate it as the alarm's subsequent
      TIMING, its only observable consequence. That restatement is a judgement.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulator is NOT discarded on a qualified clear, so it carries over and a later brief high
          trips the alarm early. A2, A3 and A4 stay true.
        text_unchanged_since_issue: 2

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The clear debounce is absent, so a single-scan glitch discards the accumulator and a genuinely
          blocked hopper never alarms — Q-HBA-02's stated failure. A1, A3 and A4 stay true.
        text_changed_from: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        why_reworded: "Narrowed to the plant-RUNNING cell so A2 and the new A4 are disjoint. Same treatment A1/A3 already had."

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is stopped and the plant then restarts with the hopper high THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is stopped and the plant then restarts with the hopper high THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The discard is gated on run state, so the freeze preserves a stale nearly-elapsed accumulator
          across a stop during which the hopper visibly emptied, and the next brief high nuisance-trips.
          AR-HBA-06's worked case: 40 s of 60 s, stop, 2 s clear — correct discards to 0, the defect alarms
          20 s later. A1, A2 and A4 stay true.
        text_unchanged_since_issue: 2

      - ordinal: A4
        form: When
        text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time while the plant is stopped and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before that brief false has accumulated"
        normalised_text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time while the plant is stopped and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before that brief false has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulator is discarded on ANY hopper-low while the plant is stopped — the freeze is applied
          only while the hopper reads high, which is exactly the scope AR-HBA-06 left and AR-HBA-09 had to
          complete. A blocked hopper whose sensor chatters once during a stop loses its whole accumulated
          budget. A1, A2 and A3 stay true — A2 covers the same chatter while RUNNING, and a defect that
          special-cases the stopped state leaves it untouched.
        new_in_issue: 3
        provenance: "AR-HBA-09, which did not exist at issue 2. This was AMB-11, which I refused to write as 'almost certainly freeze'."

  # =================================================================================================
  REQ-HBA-004:
    title: Alarm latches until reset
    instances: []
    assertions:

      - ordinal: A1
        form: Never
        text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        normalised_text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: a prohibition with no natural trigger, naming one
          output. Its own defect is a MOMENTARY alarm — the output pulses or self-clears on a timer with the
          hopper still high — which the clause's Notes call out ("level-persistent, not a momentary pulse").
        text_unchanged_since_issue: 1
        checked_against_AR_HBA_10: >-
          Still true after the power-cycle ruling. The alarm SURVIVES a power cycle (it does not de-assert),
          and the post-power-cycle clear happens on a `FaultReset` edge, so the exception this NEVER carves
          out is the one that fires. Deliberately NOT tightened to "a rising edge of FaultReset" — the
          edge-versus-level defect is isolated by REQ-HBA-005 A4, and tightening would re-hash this to catch
          a defect another assertion already catches.

  # =================================================================================================
  REQ-HBA-005:
    title: Reset clears the alarm
    instances: []
    amended_by: "AR-HBA-05 (edge / raise-dominant / accumulator untouched), AR-HBA-07 (re-raise keys on the accumulator alone), AR-HBA-08 (the de-assert's observability, split by case), AR-HBA-10 (the power-cycle route named in the cleared case)"
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is false when next observed and stays false"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is false when next observed and stays false"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset path does not reach the alarm output — the latch is unresettable, or the reset is
          consumed elsewhere — while the inhibit output does clear. A2…A6 stay true.
        text_changed_from: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is de-asserted"
        why_reworded: >-
          AR-HBA-08 rules the false in this case REQUIRED-observable and persistent. "is de-asserted" is a
          transition and does not say the false is observable or that it stays; without both, "the reset
          worked" and "the reset did nothing" are the same observation — which AR-HBA-08 says is the entire
          content of this clause. Deliberately route-agnostic: AR-HBA-08 names TWO routes to a below-
          threshold accumulator (a debounced clear, or a power cycle) and says both produce the same
          observable, so the trigger names the STATE and not the route.

      - ordinal: A2
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is false when next observed and stays false"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is false when next observed and stays false"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output is left asserted after the reset while the alarm clears — a stale stop demand
          with the annunciation already gone, which no operator action can then clear. R2. A1 and A3…A6 stay
          true.
        text_changed_from: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is de-asserted"
        why_reworded: "Mirrors A1 under AR-HBA-08."

      - ordinal: A3
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the plant is running and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the plant is running and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset ZEROES the accumulator (AR-HBA-05 rules it untouched), so an operator acknowledging a
          still-blocked hopper buys a guaranteed quiet threshold's-worth of time. A1, A2, A4, A5 and A6 stay
          true.
        text_changed_from: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is asserted again"
        why_reworded: >-
          TWO changes, both forced. (1) "asserted again" asserted that the alarm went off and came back;
          AR-HBA-08 rules any such drop DON'T-CARE, so "never went low" must not read as a failure — "true
          when next observed" is the `PersistentState` wording that ruling calls for. (2) Narrowed to the
          plant-RUNNING case so A3 and the new A6 are disjoint; AR-HBA-07's whole content is that the
          standstill case behaves the same, and that only becomes testable if it is its own assertion.

      - ordinal: A4
        form: Never
        text: "NEVER the hopper-blockage alarm is held de-asserted by a continuously-true FaultReset while the accumulated persistence time is at or past the threshold"
        normalised_text: "NEVER the hopper-blockage alarm is held de-asserted by a continuously-true FaultReset while the accumulated persistence time is at or past the threshold"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset is LEVEL-sensitive rather than edge-triggered, so a stuck-on or wired-on FaultReset pins
          the alarm off permanently and silently. A1…A3, A5 and A6 stay true: a PULSE behaves correctly in
          every one of them, which is exactly why a level defect survives all of them undetected.
        text_unchanged_since_issue: 2
        checked_against_AR_HBA_07: "Already keyed on the accumulator alone with no run-state term, which is what AR-HBA-07 ruled. No change needed."

      - ordinal: A5
        form: When
        text: "WHEN a rising edge of FaultReset occurs in the same evaluation in which the accumulated persistence time first reaches the threshold THEN the hopper-blockage alarm is true when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs in the same evaluation in which the accumulated persistence time first reaches the threshold THEN the hopper-blockage alarm is true when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RESET CONSUMES THE THRESHOLD CROSSING AND THE ALARM NEVER COMES BACK AT ALL. *** A
          reset-dominant resolution combined with a raise that is taken once, at the crossing, leaves a live
          fault PERMANENTLY suppressed — the thing AR-HBA-05 exists to forbid. A3 stays true and cannot
          catch it: in A3's scenario the alarm was already latched before the reset, so no crossing is at
          stake.
        text_changed_from: "WHEN a rising edge of FaultReset and a satisfied raise condition occur in the same evaluation THEN the hopper-blockage alarm is asserted at the end of that evaluation"
        why_reworded: >-
          Issue 2 worded this as a same-evaluation (`Coincidence`) claim. AR-HBA-08 rules the momentary drop
          DON'T-CARE, which removes that claim's only observable — so the issue-2 text asserted something the
          register now declines to make testable. Rewritten as the `PersistentState` consequence that IS
          falsifiable, per AR-HBA-08's own "005.A3 / 005.A5 can be worded as plain PersistentState". *** BUT
          IT IS NOT A STRAIGHT RESTATEMENT AND THAT MATTERS — see AMB-12. *** The PersistentState wording
          covers the permanent-suppression defect and does NOT cover AR-HBA-05's literal same-evaluation
          claim, which no assertion now covers.

      - ordinal: A6
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the plant is stopped and the accumulated persistence time is at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the plant is stopped and the accumulated persistence time is at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RE-RAISE IS GATED ON `PlantRunning`. *** Then the sequence stop -> reset, hopper still
          blocked, accumulator frozen past threshold, CLEARS A LIVE FAULT AND LEAVES IT CLEARED. A1…A5 stay
          true and none of them can catch it, because every one of them resets while running. AR-HBA-07
          calls this the most likely operator sequence there is — an operator who sees an alarm generally
          stops the plant before acknowledging it.
        new_in_issue: 3
        provenance: "AR-HBA-07, ruling AMB-10. Issue 2 worded A3 to the accumulator reading but had no assertion for the separating sequence itself, so the run-gated defect was still absorbed."

  # =================================================================================================
  REQ-HBA-006:
    title: Hopper clearing while alarm latched does not clear it
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        normalised_text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: one trigger, one response, and the inhibit output
          is not mentioned for this case. Its own defect is the alarm FOLLOWING the level rather than
          latching — the clause's stated concern ("not a live level-follow of the sensor").
        text_unchanged_since_issue: 1
        checked_against_AR_HBA_06: >-
          Still exactly right after the discard ruling, and the register's own consistency pass says so: a
          debounced clear drops the ACCUMULATOR but not the LATCH. This assertion is what makes that
          separation testable.

  # =================================================================================================
  REQ-HBA-007:
    title: Power-up / first-scan state
    instances: []
    startup: true     # §4.2's SCHEDULING ATTRIBUTE, orthogonal to the bucket. §7's wording reads as a
                      # fifth bucket and remains UNCONFIRMED (§7 open item 1).
    amended_by: "AR-HBA-10 — the power-cycle / reset gap ACCEPTED and STATED as a `WHEN … THEN … WITHIN`, with no mechanism added"
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        normalised_text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulated persistence time survives the power cycle, so a PLC restarted part-way through a
          window alarms early — at the extreme, on the first scan. A2…A5 stay true.
        text_unchanged_since_issue: 1

      - ordinal: A2
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The alarm latch does not survive the power cycle, so a live blockage is silently de-annunciated by
          a restart and the operator acknowledgement the clause requires never happens. A1 and A3…A5 stay
          true.
        text_unchanged_since_issue: 1

      - ordinal: A3
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output does not survive the power cycle while the alarm does, so the plant is released
          to run after a restart with the blockage alarm still annunciated — the opposite of the clause's
          fail-safe intent. R2. A1, A2, A4 and A5 stay true.
        text_unchanged_since_issue: 1

      - ordinal: A4
        form: When
        text: "WHEN a rising edge of FaultReset occurs after a power cycle while the hopper is still blocked THEN the hopper-blockage alarm is false when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs after a power cycle while the hopper is still blocked THEN the hopper-blockage alarm is false when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulator is RETENTIVE, so the power cycle does not zero it, the reset finds it still past
          threshold, and the alarm does not clear. A1…A3 and A5 stay true. *** THIS IS THE ASSERTION THAT
          FAILS FIRST IF NEW-HBA-05 IS EVER SETTLED IN A WAY THAT MAKES THE ACCUMULATED TIME RETENTIVE ***
          — AR-HBA-10 records that dependency and it is worth knowing which assertion carries it.
        new_in_issue: 3
        provenance: "AR-HBA-10's first response. The accepted gap: after a power cycle the accumulator is at zero, so a reset on a still-blocked hopper DOES clear the alarm."
        cross_clause_note: >-
          Close to REQ-HBA-005 A1 (both observe a false after a reset), but the triggers differ — this one
          names the power cycle as the route to a below-threshold accumulator, A1 names the state. §1's test
          is clause-scoped, so both stand. Recorded so the overlap is visible rather than found by a reviewer.

      - ordinal: A5
        form: When
        text: "WHEN a rising edge of FaultReset after a power cycle clears the hopper-blockage alarm while the hopper remains blocked and the plant runs THEN the hopper-blockage alarm is asserted again WITHIN one further persistence threshold of accumulated high-and-running time"
        normalised_text: "WHEN a rising edge of FaultReset after a power cycle clears the hopper-blockage alarm while the hopper remains blocked and the plant runs THEN the hopper-blockage alarm is asserted again WITHIN one further persistence threshold of accumulated high-and-running time"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE ALARM GOES AWAY AND NEVER COMES BACK. *** Accrual does not resume after the reset — the
          accumulator stays at zero, or the raise path is disarmed once acknowledged — so the accepted
          window never closes and the gap AR-HBA-10 accepted BECAUSE IT IS BOUNDED becomes unbounded. A4
          stays true: the alarm did clear, which is all A4 claims. *** THE WHOLE POINT OF AR-HBA-10 WRITING
          THE BOUND EXPLICITLY IS THAT A VECTOR CAN TEST THE ALARM COMES BACK, NOT MERELY THAT IT WENT AWAY.
          THAT IS THIS ASSERTION AND NOTHING ELSE COVERS IT. ***
        new_in_issue: 3
        provenance: "AR-HBA-10's second response, written into the clause as a `WHEN … THEN … WITHIN` for exactly this purpose."
        bound_note: "`WITHIN one further persistence threshold` is a bound on the response — R3 keeps it inside this assertion. The value stays in the bounds table (AR-HBA-03)."
        not_split_further: >-
          No paired inhibit assertion for the re-raise. AR-HBA-10's clause text names only the alarm for this
          case; REQ-HBA-001 A2 already carries the claim that the inhibit follows the raise. Asserting it
          here would be inventing a requirement, and the residue is recorded in AMB-13 rather than absorbed.

