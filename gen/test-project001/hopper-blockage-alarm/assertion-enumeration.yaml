# THE SPEC-DERIVED ASSERTION ENUMERATION — hopper-blockage alarm
#
# The DENOMINATOR. Produced from the specification only, before any vector exists, by a third party to
# the block's author and the vector's author (docs/notes/assertion-enumeration.md; §7 open item 3).
#
# ISSUE 2 — 2026-08-13. Re-decomposed against the register as amended by AR-HBA-01…06 (commit 74c3794)
# and against `assertion-enumeration.md` §2.2 as corrected (commit 28bfe7d).
# Issue 1 was 13 assertions. *** ISSUE 2 IS 19. *** See `reissue:` below — the count change is itself
# the event §2.3 requires, and it is NOT only AMB-05's +1.
#
# ---------------------------------------------------------------------------------------------------
# NO `id:` KEY — NOW BY DESIGN (§3.4)
#
# The enumerator issues `normalised_text:` and no `id:`; a separate stamping step computes the hashes,
# and the STAMPED file is what gets published and cited. `assertion-enumerator` is denied `Bash`
# deliberately, and an ID is a SHA-256, so this agent cannot produce one. Load with `declaredId = null`
# and let `AssertionId.Compute(clauseId, text)` fill them.
#
# *** NO VECTOR MAY CITE THIS FILE UNTIL IT HAS BEEN STAMPED (§3.4). *** A citation into an unstamped
# enumeration is a hard error, not a lookup miss.
# ---------------------------------------------------------------------------------------------------

