clauses:

  # =================================================================================================
  REQ-HBA-001:
    title: Continuous-high blockage alarm
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the hopper-blockage alarm is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the hopper-blockage alarm is asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The alarm output is never asserted, or is asserted from a condition other than the elapsed
          persistence window, while the inhibit output still asserts correctly at the same trigger. A2, A3
          and A4 stay true.
        text_unchanged_since_issue: 2

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the inhibit/stop demand output is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the inhibit/stop demand output is asserted"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output is left unwritten, or driven from a different condition, while the alarm
          output asserts correctly. R2 — one trigger, two responses. A1, A3 and A4 stay true.
        text_unchanged_since_issue: 2
        overlap_with_REQ_HBA_008: >-
          REQ-HBA-008 A1 also fails on a never-written inhibit. The two are not redundant: this one is
          keyed on the PERSISTENCE TRIGGER (the inhibit is driven from the right condition), 008 A1 on the
          ALARM (the two outputs agree). A defect driving the inhibit from a wrong condition that happens
          to match the alarm's value fails this and not 008 A1. §1's test is clause-scoped either way.

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true and no hopper-blockage alarm was previously latched THEN the hopper-blockage alarm is not asserted"
        normalised_text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true and no hopper-blockage alarm was previously latched THEN the hopper-blockage alarm is not asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The run-state gate on ACCRUAL is absent, so persistence time accrues at standstill and a full
          hopper at rest earns an alarm it never earned. A1, A2 and A4 stay true.
        rule: "R1 — the trigger's NEGATIVE case."
        text_unchanged_since_issue: 3
        carries_the_Q_HBA_04_exposure: "See `conditional_on_owner:` — this is the one assertion the Q-HBA-04 reconciliation moves."

      - ordinal: A4
        form: When
        text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        normalised_text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RESET-ON-STOP DEFECT. *** The elapsed persistence time is DISCARDED on loss of running
          rather than FROZEN, so an interrupted run never reaches the threshold and a genuinely blocked
          hopper never alarms. A1 stays true.
        text_unchanged_since_issue: 2
        not_split_further: "No paired inhibit assertion — REQ-HBA-008 now carries the tracking claim once, for every transition. See `why_no_per_case_inhibit_siblings:`."

  # =================================================================================================
  REQ-HBA-002:
    title: No alarm below threshold
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false and stays continuously false for at least the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is not raised for that high episode"
        normalised_text: "WHEN Hopper_Level_High goes false and stays continuously false for at least the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is not raised for that high episode"
        response_signal: HopperBlockedAlarm
        split_defect: "The clear is not honoured at all — the accumulator ignores hopper-low entirely — so an episode that visibly cleared still alarms. A2 stays true."
        text_unchanged_since_issue: 2

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is still raised for that high episode"
        normalised_text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is still raised for that high episode"
        response_signal: HopperBlockedAlarm
        split_defect: "The clear debounce is absent, so any glitch to false counts as a clear and prevents the alarm — a blocked hopper with a chattering sensor never alarms. A1 stays true."
        text_unchanged_since_issue: 2

  # =================================================================================================
  REQ-HBA-003:
    title: Momentary clear re-arms the window
    instances: []
    decomposition_shape: >-
      A 2x2 over (debounced clear | brief false) x (plant running | plant stopped). Q-HBA-02 gave the
      debounced/brief axis; AR-HBA-06 the stopped case of the debounced route; AR-HBA-09 the stopped case
      of the brief route, which had been an outright gap. Each cell has its own isolating defect.
    premise_relied_on: "AR-HBA-09: the clear-debounce filter runs IRRESPECTIVE of `PlantRunning`. A3 and A4 are unreachable without it."
    note_on_form: >-
      The clause asserts an INTERNAL STATE TRANSITION ("discards the accumulated persistence time"), which
      is not an observable response. All four assertions restate it as the alarm's subsequent TIMING. That
      restatement is a judgement.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: "The accumulator is NOT discarded on a qualified clear, so it carries over and a later brief high trips the alarm early. A2, A3 and A4 stay true."
        text_unchanged_since_issue: 2

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: "The clear debounce is absent, so a single-scan glitch discards the accumulator and a genuinely blocked hopper never alarms. A1, A3 and A4 stay true."
        text_unchanged_since_issue: 3

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is stopped and the plant then restarts with the hopper high THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is stopped and the plant then restarts with the hopper high THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The discard is gated on run state, so the freeze preserves a stale nearly-elapsed accumulator
          across a stop during which the hopper visibly emptied. AR-HBA-06's worked case: 40 s of 60 s,
          stop, 2 s clear — correct discards to 0, the defect alarms 20 s later. A1, A2 and A4 stay true.
        text_unchanged_since_issue: 2

      - ordinal: A4
        form: When
        text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time while the plant is stopped and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before that brief false has accumulated"
        normalised_text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time while the plant is stopped and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before that brief false has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulator is discarded on ANY hopper-low while the plant is stopped — the freeze applied
          only while the hopper reads high, the scope AR-HBA-06 left and AR-HBA-09 completed. A blocked
          hopper whose sensor chatters once during a stop loses its whole budget. A1, A2 and A3 stay true.
        text_unchanged_since_issue: 3

  # =================================================================================================
  REQ-HBA-004:
    title: Alarm latches until reset
    instances: []
    assertions:

      - ordinal: A1
        form: Never
        text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        normalised_text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: a prohibition with no natural trigger, naming
          one output. Its own defect is a MOMENTARY alarm — the output pulses or self-clears on a timer
          with the hopper still high ("level-persistent, not a momentary pulse").
        text_unchanged_since_issue: 1
        checked_against_REQ_HBA_008: >-
          No conflict. REQ-HBA-008 makes the inhibit inherit this latch discipline by tracking; it does not
          weaken or duplicate the alarm's own prohibition, which is about WHEN the alarm may fall, not
          about the two outputs agreeing.

  # =================================================================================================
  REQ-HBA-005:
    title: Reset clears the alarm
    instances: []
    why_no_per_case_inhibit_siblings: >-
      *** DELIBERATE, AND IT IS AR-HBA-12'S OWN DESIGN. *** REQ-HBA-005's Text now says AR-HBA-08's
      by-case observability split "applies to both outputs identically". That is a statement about HOW TO
      OBSERVE, not a second RESPONSE — the clause states an inhibit response only for the CLEAR case
      ("clears the latched hopper-blockage alarm and, with it, the inhibit/stop demand"), which is A2.
      Adding inhibit siblings to A3/A5/A6 would restate REQ-HBA-008's tracking claim once per case, which
      is exactly what AR-HBA-12 chose a GENERAL clause to avoid ("one general statement makes AR-HBA-10's
      case fall out with no special-casing"). Enumerating it per case would defeat that ruling and inflate
      the denominator with assertions that all fail on one defect.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is false when next observed and stays false"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is false when next observed and stays false"
        response_signal: HopperBlockedAlarm
        split_defect: "The reset path does not reach the alarm output while the inhibit output does clear. A2…A6 stay true."
        text_unchanged_since_issue: 3
        route_agnostic_by_design: >-
          The trigger names the STATE (accumulator below threshold), not the ROUTE. AR-HBA-08 names two
          routes — a debounced clear, or a power cycle — and says both produce the same observable. That
          choice pays off at REQ-HBA-007: the post-power-cycle reset IS this trigger, so A1/A2 already
          carry the observable-false requirement for AR-HBA-10's window without a third pair.

      - ordinal: A2
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is false when next observed and stays false"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is false when next observed and stays false"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output is left asserted after the reset while the alarm clears — a stale stop demand
          with the annunciation already gone, which no operator action can then clear. R2. A1 and A3…A6
          stay true.
        text_unchanged_since_issue: 3
        discharges: "REQ-HBA-008's 'an observable and persistent false is REQUIRED once it has cleared', for the inhibit, on both routes to a cleared condition."

      - ordinal: A3
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the plant is running and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the plant is running and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset ZEROES the accumulator, so an operator acknowledging a still-blocked hopper buys a
          guaranteed quiet threshold's-worth of time. A1, A2, A4, A5 and A6 stay true.
        text_unchanged_since_issue: 3

      - ordinal: A4
        form: Never
        text: "NEVER the hopper-blockage alarm is held de-asserted by a continuously-true FaultReset while the accumulated persistence time is at or past the threshold"
        normalised_text: "NEVER the hopper-blockage alarm is held de-asserted by a continuously-true FaultReset while the accumulated persistence time is at or past the threshold"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset is LEVEL-sensitive rather than edge-triggered, so a stuck-on or wired-on FaultReset
          pins the alarm off permanently and silently. A1…A3, A5 and A6 stay true: a PULSE behaves
          correctly in every one of them, which is why a level defect survives all of them undetected.
        text_unchanged_since_issue: 2

      - ordinal: A5
        form: When
        text: "WHEN a rising edge of FaultReset occurs in the same evaluation in which the accumulated persistence time first reaches the threshold THEN the hopper-blockage alarm is true when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs in the same evaluation in which the accumulated persistence time first reaches the threshold THEN the hopper-blockage alarm is true when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RESET CONSUMES THE THRESHOLD CROSSING AND THE ALARM NEVER COMES BACK AT ALL. *** A live
          fault PERMANENTLY suppressed. A3 stays true and cannot catch it: in A3's scenario the alarm was
          already latched before the reset, so no crossing is at stake.
        text_unchanged_since_issue: 3
        AR_HBA_11_outcome: >-
          *** CONFIRMED BY COMPARISON, NOT ASSUMED. *** AR-HBA-11 amended AR-HBA-05's raise-dominance
          sentence to read "the reset does not consume that crossing: the alarm is asserted when next
          observed". This text already said that. AMB-12 therefore closes with ZERO re-hashes, exactly as
          the ruling predicted, and the stale second source is gone rather than merely contradicted.

      - ordinal: A6
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the plant is stopped and the accumulated persistence time is at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the plant is stopped and the accumulated persistence time is at or past the threshold THEN the hopper-blockage alarm is true when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RE-RAISE IS GATED ON `PlantRunning`. *** The sequence stop -> reset, hopper still
          blocked, accumulator frozen past threshold, CLEARS A LIVE FAULT AND LEAVES IT CLEARED. A1…A5 stay
          true and none can catch it, because every one of them resets while running.
        text_unchanged_since_issue: 3

  # =================================================================================================
  REQ-HBA-006:
    title: Hopper clearing while alarm latched does not clear it
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        normalised_text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: one trigger, one response. Its own defect is the
          alarm FOLLOWING the level rather than latching.
        text_unchanged_since_issue: 1
        checked_against_REQ_HBA_008: >-
          Clean. A debounced clear drops the ACCUMULATOR, not the LATCH, so NEITHER output moves — the
          tracking relation is undisturbed by the very case that most looks like it should disturb it.

  # =================================================================================================
  REQ-HBA-007:
    title: Power-up / first-scan state
    instances: []
    startup: true     # §4.2's SCHEDULING ATTRIBUTE, orthogonal to the bucket. §7's wording reads as a
                      # fifth bucket and remains UNCONFIRMED (§7 open item 1).
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        normalised_text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: "The accumulated persistence time survives the power cycle, so a PLC restarted part-way through a window alarms early — at the extreme, on the first scan. A2…A5 stay true."
        text_unchanged_since_issue: 1

      - ordinal: A2
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: "The alarm latch does not survive the power cycle, so a live blockage is silently de-annunciated by a restart. A1 and A3…A5 stay true."
        text_unchanged_since_issue: 1

      - ordinal: A3
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output does not survive the power cycle while the alarm does, so the plant is
          released to run after a restart with the blockage alarm still annunciated. R2. A1, A2, A4 and A5
          stay true.
        text_unchanged_since_issue: 1
        overlap_with_REQ_HBA_008: >-
          REQ-HBA-008 A1 also fails on a retentivity mismatch between the two outputs. Kept: the register
          states this response in REQ-HBA-007's own Text, and §1's test is clause-scoped. Recorded so the
          overlap is visible rather than found by a reviewer.

      - ordinal: A4
        form: When
        text: "WHEN a rising edge of FaultReset occurs after a power cycle while the hopper is still blocked THEN the hopper-blockage alarm is false when next observed"
        normalised_text: "WHEN a rising edge of FaultReset occurs after a power cycle while the hopper is still blocked THEN the hopper-blockage alarm is false when next observed"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulator is RETENTIVE, so the power cycle does not zero it, the reset finds it still past
          threshold, and the alarm does not clear. A1…A3 and A5 stay true. *** THIS IS THE ASSERTION THAT
          FAILS FIRST IF NEW-HBA-05 IS EVER SETTLED IN A WAY THAT MAKES THE ACCUMULATED TIME RETENTIVE ***
          — AR-HBA-10 records that dependency and it is worth knowing which assertion carries it.
        text_unchanged_since_issue: 3

      - ordinal: A5
        form: When
        text: "WHEN a rising edge of FaultReset after a power cycle clears the hopper-blockage alarm while the hopper remains blocked and the plant runs THEN the hopper-blockage alarm is asserted again WITHIN one further persistence threshold of accumulated high-and-running time"
        normalised_text: "WHEN a rising edge of FaultReset after a power cycle clears the hopper-blockage alarm while the hopper remains blocked and the plant runs THEN the hopper-blockage alarm is asserted again WITHIN one further persistence threshold of accumulated high-and-running time"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE ALARM GOES AWAY AND NEVER COMES BACK. *** Accrual does not resume after the reset, so the
          accepted window never closes and the gap AR-HBA-10 accepted BECAUSE IT IS BOUNDED becomes
          unbounded. A4 stays true: the alarm did clear, which is all A4 claims.
        text_unchanged_since_issue: 3
        bound_note: "`WITHIN one further persistence threshold` is a bound on the response — R3 keeps it inside this assertion. The value stays in the bounds table (AR-HBA-03)."
        AMB_13_now_closed_by: >-
          The inhibit's return inside this window is carried by REQ-HBA-008 A1 — with the alarm asserted
          again, an inhibit that stays low violates it. AR-HBA-12's general clause makes AR-HBA-10's case
          fall out with no special-casing, exactly as the ruling intended, so no sixth assertion is needed
          here and none was invented.

  # =================================================================================================
  REQ-HBA-008:
    title: The inhibit output tracks the alarm output
    instances: []
    new_clause_in_issue: 4
    added_by: "AR-HBA-12 (agent ruling, not owner), closing AMB-13"
    decomposition_reasoning: >-
      *** DECOMPOSED FROM THE CLAUSE'S SUMMARY SENTENCE, NOT FROM ITS FOUR BULLETS, AND THAT IS THE WHOLE
      DECISION. *** The clause lists four transitions (asserts on raise / stays asserted while latched /
      de-asserts on reset / re-asserts on re-raise) and then states the invariant they are instances of:
      "There is no state in which one output is asserted and the other is not." Each bullet was tested as
      a candidate and NONE has an isolating defect against the invariant — every defect that breaks a
      bullet (set-only latch, one-shot pulse, tracks the first raise but not a re-raise, asserts late) is
      already a state where the two outputs disagree. The INVARIANT, however, splits cleanly into its two
      DIRECTIONS, and those two do isolate each other. So: 2 assertions, one per direction, and the four
      bullets are covered as instances rather than enumerated as siblings.
    reading_taken: >-
      The bullet "de-asserts when the alarm is cleared by `FaultReset`" reads unconditionally in
      isolation, but the alarm is only *cleared* when the condition has gone (REQ-HBA-005); when it holds,
      the alarm re-raises and so does the inhibit. The clause's own summary sentence and its observability
      paragraph resolve this, so it is a terse bullet rather than a contradiction. The two assertions are
      taken from the summary sentence, which is the reading that cannot be got wrong.
    observability: >-
      AR-HBA-08's by-case split applies to this output identically (clause Text; the fourth-collision
      closure). *** BOTH ASSERTIONS ARE SIMULTANEITY CLAIMS, AND THAT IS WHAT MAKES THEM COMPATIBLE WITH
      THE DON'T-CARE. *** They assert that the two outputs AGREE, never that either takes a particular
      value at a transient — so a shared momentary drop satisfies both, and no vector citing them is
      pushed into asserting on the transient AR-HBA-08 removed. This is the collision the register found
      and closed in place; the enumeration's wording had to not reopen it, and it does not.
    assertions:

      - ordinal: A1
        form: Never
        text: "NEVER the inhibit/stop demand output reads false while the hopper-blockage alarm is asserted"
        normalised_text: "NEVER the inhibit/stop demand output reads false while the hopper-blockage alarm is asserted"
        response_signal: HopperBlockedInhibit
        also_requires_observation_of: HopperBlockedAlarm      # <- SEE AMB-14: the wire format cannot carry this
        split_defect: >-
          The inhibit is a one-shot pulse on the alarm's rising edge, or tracks the first raise but not a
          re-raise, or is never written at all — any of which leaves the plant free to run while the
          blockage alarm is annunciated. *** THIS IS THE OPERATIONALLY IMPORTANT DIRECTION: it is the one
          that lets a blocked plant run. *** A2 stays true throughout — an inhibit stuck low never reads
          true while the alarm is low.
        new_in_issue: 4

      - ordinal: A2
        form: Never
        text: "NEVER the inhibit/stop demand output reads true while the hopper-blockage alarm is not asserted"
        normalised_text: "NEVER the inhibit/stop demand output reads true while the hopper-blockage alarm is not asserted"
        response_signal: HopperBlockedInhibit
        also_requires_observation_of: HopperBlockedAlarm      # <- SEE AMB-14
        split_defect: >-
          The inhibit is a set-only latch: it follows the alarm up and never comes down, so after a
          `FaultReset` on a cleared blockage the plant stays stopped with nothing annunciated and no
          operator action able to release it. A1 stays true throughout — an inhibit stuck HIGH never reads
          false while the alarm is high.
        new_in_issue: 4

  # NOTE ON WORDING, since the coordinator asked directly: *** AR-HBA-12's "VALUE, NOT WIRING"
  # QUALIFICATION CHANGES NOTHING IN HOW THESE ARE WORDED, AND THE REASON IS THE `response_signal:`
  # FIELD. *** Both assertions are claims about what `HopperBlockedInhibit` READS, and the field names it,
  # so a vector must observe that member itself — it cannot satisfy the mechanical check by expecting on
  # `HopperBlockedAlarm` and arguing the two are "the same". That is precisely the "distinct interface
  # members, independent routing" property Q-HBA-05 requires, enforced by the field rather than by prose.
  # No existing inhibit assertion (001.A2, 005.A2, 007.A3) needed rewording either: all three already say
  # "the inhibit/stop demand output is ..." and carry `HopperBlockedInhibit`.

