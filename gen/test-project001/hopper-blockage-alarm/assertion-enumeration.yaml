# Every signal name used, and the register line it came from. R5 forbids naming a tag INTERNAL TO THE
# DESIGN; all of these are declared in the specification itself.
signal_provenance:
  Hopper_Level_High:      "register §Tag grounding (DB_Input, Bool, exists)"
  FaultReset:             "register §Tag grounding (DB_Controls, Bool, exists)"
  Shredder_Run_Fwd_FB:    "register Q-HBA-04, owner-resolved run-state signal"
  Shredder_Run_Rev_FB:    "register Q-HBA-04, owner-resolved run-state signal"
  HopperBlockedAlarm:     "register Q-HBA-05 (owner)"
  HopperBlockedInhibit:   "register Q-HBA-05 as named by AR-HBA-01 (AGENT ruling, not owner) — see the warning below"

response_signal_naming_warning: >-
  *** AR-HBA-01 NAMED `HopperBlockedInhibit` WITHOUT READING THE IMPLEMENTATION, ON PURPOSE, AND THIS
  ENUMERATION INHERITS THAT. *** If the block's actual second output is named something else, that is a
  FINDING ABOUT THE BLOCK and not a defect in this file. A vector must expect on the SPEC's name. Do not
  "fix" this enumeration by copying the block's name in — that makes spec and block agree by
  construction, which is the correlated check the whole pipeline exists to prevent.

# Signal names are carried in `response_signal:`, NOT welded into assertion text. Assertion text stays in
# process language ("the hopper-blockage alarm", "the inhibit/stop demand output") so that naming or
# renaming a signal does not re-hash a claim whose behaviour did not change. AR-HBA-01 therefore cost ZERO
# re-hashes while still restoring the mechanical `ResponseSignal`-in-`Expectations` check.

# R4 — the instance set is the ENUMERATOR'S, declared from the clause text.
