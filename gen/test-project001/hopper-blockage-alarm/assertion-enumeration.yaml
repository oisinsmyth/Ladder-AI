    issue after stamping would carry — which is the argument for stamping LATE, not early.
  count_change_is_an_event: >-
    *** THE COORDINATOR'S MESSAGE SAID 14. THE REGISTER SAYS 19, AND THE REGISTER IS THE AUTHORITY. ***
    14 is what AMB-05's ruling alone produces (13 + the fourth REQ-HBA-001 assertion). But four of the
