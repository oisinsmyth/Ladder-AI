reissue:
  previous_issue: 4
  previous_count: 25
  this_count: 27
  re_hashes_this_issue: 0
  trigger: >-
    *** NOT A RULING ROUND — A DECOMPOSITION DISPUTE FROM OUTSIDE THE REGISTER. *** An independent vector
    author found that no assertion forbade the alarm raising EARLY on an uninterrupted first episode:
    REQ-HBA-002 is TITLED "No alarm below threshold" but AR-HBA-04 had narrowed its text to the
    debounced-clear case only, so an under-scaled preset left all 25 assertions TRUE. AR-HBA-13 restores
    the unconditional limb alongside AR-HBA-04's, both live.
  where_the_two_came_from:
    - "REQ-HBA-002 A3 — limb 1's ALARM claim, against the SPECIFIED threshold."
    - "REQ-HBA-008 A3 — limb 1's INHIBIT claim, which REQ-HBA-008's Text now makes explicit, and which NOTHING ELSE IN THE ENUMERATION CAN CATCH (see its split_defect)."
  why_my_own_passes_missed_it: >-
    Recorded plainly rather than excused. Four consistency passes read REQ-HBA-002 and found it
    consistent, and they were right: *** THE TEXT I DECOMPOSED GENUINELY NO LONGER MADE THE CLAIM. *** A
    narrowing repair is the dangerous kind — it removes a claim while leaving the title, the clause ID,
    the cross-references and the assertion count all intact, so every sign that the claim is still there
    survives. Nothing in a clause-by-clause or a combination read can recover a claim that is simply
    absent from the text. What found it was somebody trying to WRITE A TEST for the behaviour the title
    promised — which is the same mechanism that found §2.2's contradiction at issue 1, one layer out.
  lesson_for_the_method: >-
    A TITLE IS NOT A CLAIM, AND AN ENUMERATOR CANNOT TREAT IT AS ONE. But a title that no assertion of its
    clause supports IS a cheap, mechanical smell test — and this enumeration had one for four rounds. It
    is raised as AMB-17 rather than adopted unilaterally, because inventing assertions from titles is
    exactly how a denominator stops being spec-derived.

