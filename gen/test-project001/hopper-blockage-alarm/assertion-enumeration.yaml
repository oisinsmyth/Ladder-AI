# THE SPEC-DERIVED ASSERTION ENUMERATION — hopper-blockage alarm
#
# The DENOMINATOR. Produced from the specification only, before any vector exists, by a third party to
# the block's author and the vector's author (docs/notes/assertion-enumeration.md; §7 open item 3).
#
# ---------------------------------------------------------------------------------------------------
# *** THE IDs ARE NOT WRITTEN HERE, AND THAT IS DELIBERATE — READ THIS BEFORE CITING ANYTHING. ***
#
# An assertion ID is `<clause>:<first 6 lowercase hex of SHA-256(normalised text)>`. The
# `assertion-enumerator` agent has NO `Bash` tool (deliberately, so it cannot run the converter over a
# block), and therefore NO WAY TO COMPUTE A SHA-256. Writing plausible-looking hex would be a
# hand-edited ID — exactly what `EnumerationDefect.IdDoesNotRecompute` exists to catch — so no `id:`
# key is emitted at all.
#
# Every assertion below carries `normalised_text:` — the exact string to hash, already normalised per
# `AssertionId.Normalise` (trimmed, internal whitespace collapsed, no trailing '.' or ';', case
# preserved). Load this file with `declaredId = null` and let `AssertionId.Compute(clause_id, text)`
# produce the IDs; that is the correct path and it is also the only one that cannot carry a typo.
#
# *** NO VECTOR MAY BE WRITTEN AGAINST THIS FILE UNTIL THE IDs HAVE BEEN COMPUTED AND PUBLISHED. ***
# ---------------------------------------------------------------------------------------------------

enumerator: assertion-enumerator
enumerated: 2026-08-13
register: gen/test-project001/hopper-blockage-alarm/requirements.md
register_clause_ids_stable: true   # `### REQ-HBA-nnn — <title>`, declared "stable forever" (register §Format). §3.2 precondition satisfied.

# Files read to produce this enumeration — the R5 contamination declaration.
sources_read:
  - CLAUDE.md
  - docs/notes/assertion-enumeration.md
  - docs/notes/test-environment-contract.md            # §3 only (what cites this artifact)
  - .claude/skills/enumerate-assertions/SKILL.md
  - src/harness/Harness.Gate/SubmissionDocument.cs      # step 0a — verify the verifier
  - src/wave-control/WaveControl/AssertionEnumeration.cs
  - src/wave-control/WaveControl/AssertionIdentity.cs
  - src/wave-control/WaveControl/CoverageClassification.cs
  - gen/test-project001/hopper-blockage-alarm/requirements.md
not_read:
  # Deliberate. Reading any of these would make the denominator a second reading of the implementation.
  - ir/**                                               # no IR, no tag files, no exports
  - gen/test-project001/hopper-blockage-alarm/architecture.md
  - gen/test-project001/hopper-blockage-alarm/review-findings.md
  - gen/test-project001/hopper-blockage-alarm/integration.md
  - gen/test-project001/code-structure.md
  - patterns/**

# Every signal name appearing in assertion text, and the register line it came from. R5 forbids naming
# a tag INTERNAL TO THE DESIGN; these are all declared in the specification itself.
signal_provenance:
  Hopper_Level_High:      "register §Tag grounding (DB_Input, Bool, exists)"
  FaultReset:             "register §Tag grounding (DB_Controls, Bool, exists)"
  Shredder_Run_Fwd_FB:    "register Q-HBA-04, owner-resolved run-state signal"
  Shredder_Run_Rev_FB:    "register Q-HBA-04, owner-resolved run-state signal"
  HopperBlockedAlarm:     "register Q-HBA-05, owner-resolved FB output (response_signal only; not in assertion text)"
  "<UNNAMED inhibit/stop demand output>": "register Q-HBA-05 describes it, NAMES IT NOWHERE — see ambiguities/AMB-03"

# R4 — the instance set is the ENUMERATOR'S, declared from the clause text, not from what anyone cites.
instance_declaration:
  scope: class-level for every clause (`instances: []`)
  rationale: >-
    No clause text names a set. The register's Scope line reads "this one FB only"; the tag grounding
    declares exactly one hopper level input, one operator reset, and Q-HBA-04 one shredder run-feedback
    pair. There is no "each of the N hoppers" anywhere in the register, so the declared instance set is
    a single implicit instance and each assertion is one coverage unit.
  standing_condition: >-
    *** IF THIS FB IS EVER PLACED MORE THAN ONCE, THIS DECLARATION IS WRONG AND MUST BE RE-DECLARED BY
    AN ENUMERATOR — IT IS A RE-DECOMPOSITION EVENT, NOT SOMETHING A CITATION FIXES. *** A citation
    naming an instance this file did not declare is a FINDING (§4/R4), never a new unit.

denominator:
  clauses: 7
  assertions: 13
  coverage_units: 13          # assertions x declared instances

clauses:

  # =================================================================================================
  REQ-HBA-001:
    title: Continuous-high blockage alarm
    text: >-
      When `Hopper_Level_High` remains continuously true for longer than the persistence threshold
      time, a hopper-blockage alarm is raised.
    refined_by:
      - "Q-HBA-01 (RESOLVED): threshold = 60 s, FB-own tunable, commissioning-changeable"
      - "Q-HBA-04 (RESOLVED): accumulates only while running; run state = Shredder_Run_Fwd_FB OR Shredder_Run_Rev_FB"
      - "Q-HBA-05 (RESOLVED): the FB emits TWO outputs — an alarm and an inhibit/stop demand"
      - "NEW-HBA-01 (RESOLVED, gate 1): pause-and-resume; 'continuously high' becomes 'cumulatively high-and-running'"
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High has been continuously true while the plant is running for a cumulative time exceeding the persistence threshold THEN the hopper-blockage alarm is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true while the plant is running for a cumulative time exceeding the persistence threshold THEN the hopper-blockage alarm is asserted"
        response_signal: HopperBlockedAlarm
        bound: "persistence threshold = T#60S (Q-HBA-01). Held OUT of the hashed text on purpose — see ambiguities/AMB-06."
        split_defect: >-
          The alarm output is never asserted, or is asserted from a condition other than the elapsed
          persistence window, while the inhibit/stop demand still asserts correctly at the same trigger.
          A2 and A3 stay true — Q-HBA-05 makes these two independent FB outputs.

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High has been continuously true while the plant is running for a cumulative time exceeding the persistence threshold THEN the inhibit/stop demand output is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true while the plant is running for a cumulative time exceeding the persistence threshold THEN the inhibit/stop demand output is asserted"
        response_signal: "<UNNAMED — Q-HBA-05's inhibit/stop demand output; see ambiguities/AMB-03>"
        split_defect: >-
          The inhibit/stop demand output is left unwritten (or is driven from a different condition)
          while the alarm output asserts correctly. R2 — one trigger, two responses, and a defect can
          produce one and not the other. A1 and A3 stay true.

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true THEN the hopper-blockage alarm is not asserted"
        normalised_text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true THEN the hopper-blockage alarm is not asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The run-state gate is absent, so persistence time accumulates at standstill and a full hopper
          alarms with the plant stopped — Q-HBA-04's own worked case ("a full hopper at standstill does
          not alarm"). A1 and A2 stay true: the running case still behaves correctly.
        rule: "R1 — the trigger's NEGATIVE case, which is the half most often lost."

    candidate_assertion_NOT_enumerated:
      # Recorded so the next enumerator can CHECK this call instead of re-arguing it, and so a ruling
      # can adopt it cheaply. It has no ID and MUST NOT be cited.
      - text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        why_not_enumerated: >-
          NEW-HBA-01's pause-and-resume. Splitting it out gives a defect that breaks it alone
          (elapsed time RESET on loss of running rather than frozen), but leaves A1 with NO defect that
          breaks A1 while this stays true — every defect in the accumulate-and-compare breaks both, and
          the only defect that isolates A1 ("the alarm trips only after a running interruption") is
          describable solely in terms of how the timing is wired, which R5 forbids. Under §1's
          definition (existential per assertion) the split therefore does not survive, so pause-and-
          resume is folded into A1's TRIGGER — which is how NEW-HBA-01 words it itself ("refines
          REQ-HBA-001's 'continuously high' to 'cumulatively high-and-running'").
        consequence: "See ambiguities/AMB-05. If §2.2's one-sided tie-break governs instead, REQ-HBA-001 is 4 assertions and the denominator is 14."

  # =================================================================================================
  REQ-HBA-002:
    title: No alarm below threshold
    text: >-
      If `Hopper_Level_High` clears (goes false) before the persistence threshold elapses, no
      hopper-blockage alarm is raised for that high episode.
    refined_by:
      - "Q-HBA-02 (RESOLVED): a clear must persist for a short filter time before it counts as a clear"
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time before the persistence threshold has elapsed THEN the hopper-blockage alarm is not asserted for that high episode"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time before the persistence threshold has elapsed THEN the hopper-blockage alarm is not asserted for that high episode"
        response_signal: HopperBlockedAlarm
        bound: "clear-debounce filter time = T#2S (NEW-HBA-03)"
        split_defect: >-
          Sole assertion of the clause. NOT split further: the clause states one trigger and one
          response, and the demand output is not mentioned anywhere for this case (adding it would be
          inventing a requirement). Independently falsifiable against REQ-HBA-003's assertions by the
          defect "the alarm is raised on the FALLING edge of Hopper_Level_High regardless of elapsed
          time" — that breaks this and leaves REQ-HBA-003 A1/A2 intact.
        reading_taken: >-
          "goes false" is read as a DEBOUNCED clear (>= the filter time), because Q-HBA-02 rules that a
          brief clear is not a clear. Read literally against Q-HBA-02 the two contradict — see
          ambiguities/AMB-08.

  # =================================================================================================
  REQ-HBA-003:
    title: Momentary clear re-arms the window
    text: >-
      The alarm condition requires `Hopper_Level_High` to be *continuously* high: any transition of
      `Hopper_Level_High` to false before the threshold elapses resets the persistence timing, so the
      full threshold must accumulate again from the next rising edge. A momentary clear does not leave
      a partially-elapsed window that would trip on a later brief high.
    refined_by:
      - "Q-HBA-02 (RESOLVED): a momentary/brief clear must NOT reset the window; only a clear lasting the filter time re-arms it"
    instances: []
    note_on_form: >-
      As written this clause asserts an INTERNAL STATE TRANSITION ("resets the persistence timing"),
      which is not an observable response and does not fit either canonical form. Both assertions below
      restate it in terms of the alarm's subsequent TIMING, which is its only observable consequence.
      That restatement is a judgement a second enumerator could make differently — see the report.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulated persistence time is NOT discarded on a qualified clear, so it carries over and
          a later brief high trips the alarm early — the clause's own worked case. A2 stays true (a
          glitch still fails to re-arm anything), and REQ-HBA-002 A1 stays true (the first episode still
          does not alarm).

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        response_signal: HopperBlockedAlarm
        bound: "clear-debounce filter time = T#2S (NEW-HBA-03)"
        split_defect: >-
          The clear debounce is absent, so a single-scan glitch to false discards the window and a
          genuinely blocked hopper never alarms — Q-HBA-02's stated failure ("a one-scan glitch to false
          no longer re-arms"). A1 stays true: a long clear still correctly re-arms.
        rule: "R1 — Q-HBA-02 creates a SECOND, opposite-signed trigger (a short clear vs a qualified clear)."

  # =================================================================================================
  REQ-HBA-004:
    title: Alarm latches until reset
    text: >-
      Once raised, the hopper-blockage alarm remains asserted regardless of any subsequent change in
      `Hopper_Level_High`, until it is reset.
    instances: []
    assertions:

      - ordinal: A1
        form: Never
        text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        normalised_text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: the clause is a prohibition with no natural
          trigger (the NEVER form's stated purpose) and names exactly one output. Its own defect is a
          MOMENTARY alarm — the output pulses or self-clears on a timer while Hopper_Level_High is still
          true — which the clause's Notes call out directly ("level-persistent, not a momentary pulse").
        cross_clause_note: >-
          REQ-HBA-006's assertion is a strict SUB-CASE of this one (hopper-goes-false is one of the
          "subsequent changes" this forbids clearing on). That is the register's redundancy, not the
          enumeration's: §1's falsifiability test is scoped WITHIN a clause, so both stand. A defect
          isolating this from REQ-HBA-006 exists (self-clearing pulse with the hopper still high); the
          converse does not.

  # =================================================================================================
  REQ-HBA-005:
    title: Reset clears the alarm
    text: "Asserting `FaultReset` clears the latched hopper-blockage alarm."
    refined_by:
      - "Q-HBA-05 (RESOLVED): the FB emits an alarm output AND an inhibit/stop demand output"
      - "REQ-HBA-007 text: the associated stop/inhibit demand 'persists until acknowledged' — FaultReset being the acknowledgement"
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN FaultReset is asserted while the hopper-blockage alarm is latched THEN the hopper-blockage alarm is de-asserted"
        normalised_text: "WHEN FaultReset is asserted while the hopper-blockage alarm is latched THEN the hopper-blockage alarm is de-asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset path does not reach the alarm output (the latch is unresettable, or the reset is
          consumed elsewhere) while the demand output does clear. A2 stays true.

      - ordinal: A2
        form: When
        text: "WHEN FaultReset is asserted while the hopper-blockage alarm is latched THEN the inhibit/stop demand output is de-asserted"
        normalised_text: "WHEN FaultReset is asserted while the hopper-blockage alarm is latched THEN the inhibit/stop demand output is de-asserted"
        response_signal: "<UNNAMED — Q-HBA-05's inhibit/stop demand output; see ambiguities/AMB-03>"
        split_defect: >-
          The demand output is left asserted after the reset while the alarm clears — a stale stop
          demand with the annunciation already gone, which no operator action can then clear. R2: two
          independent FB outputs. A1 stays true.
        derivation: >-
          Not in REQ-HBA-005's own sentence. Derived from REQ-HBA-007's text ("the associated
          stop/inhibit demand correspondingly persists until acknowledged") plus Q-HBA-05's two outputs.
          Recorded explicitly so the derivation is checkable rather than assumed.

  # =================================================================================================
  REQ-HBA-006:
    title: Hopper clearing while alarm latched does not clear it
    text: >-
      `Hopper_Level_High` returning to false while the hopper-blockage alarm is latched does not by
      itself clear the alarm; it persists until `FaultReset`.
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        normalised_text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: one trigger, one response, and the demand
          output is not mentioned for this case. Its own defect is the alarm FOLLOWING the level rather
          than latching — the clause's own stated concern ("not a live level-follow of the sensor").

  # =================================================================================================
  REQ-HBA-007:
    title: Power-up / first-scan state
    text: >-
      At PLC power-up / first scan the **transient** persistence state starts fresh — no
      partially-elapsed window, held-elapsed value, or in-progress timer survives the power cycle. The
      **latched hopper-blockage alarm does survive** the power cycle (it is a genuine fault requiring
      operator acknowledgement) and is cleared only by `FaultReset`; the associated stop/inhibit demand
      correspondingly persists until acknowledged.
    startup: true     # §4.2's SCHEDULING ATTRIBUTE, orthogonal to the bucket. Treated as a routing tag,
                      # not a fifth bucket — §7's own wording reads as a bucket and is UNCONFIRMED.
    instances: []
    status_warning: >-
      *** THIS CLAUSE'S TEXT IS UNDER AN OPEN SECOND-CONFIRM. *** The register's own gate-1 list records
      NEW-HBA-04 as "OPEN (second-confirm at design revision)" and "owner OK needed" for the very
      revision the clause text already carries. Enumerated as written, because the clause Text field is
      the requirement. If the owner rules the other way, A2 and A3 are reworded, their IDs change, and
      every citation to them goes STALE. See ambiguities/AMB-04.
    note_on_form: >-
      "the transient persistence state starts fresh" is internal state, not an observable response. A1
      restates it as the alarm's observable timing after a power cycle.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        normalised_text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The elapsed persistence time survives the power cycle, so a PLC restarted part-way through a
          window alarms early — or, at the extreme, alarms on the first scan. A2 and A3 stay true: the
          latch still survives, which is a different retention decision on a different item.

      - ordinal: A2
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The alarm latch does not survive the power cycle (non-retentive, or cleared at first scan), so
          a live blockage is silently de-annunciated by a restart and the operator acknowledgement the
          clause requires never happens. A1 and A3 stay true.

      - ordinal: A3
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        response_signal: "<UNNAMED — Q-HBA-05's inhibit/stop demand output; see ambiguities/AMB-03>"
        split_defect: >-
          The demand output does not survive the power cycle while the alarm does, so the plant is
          released to run after a restart with the blockage alarm still annunciated — the exact opposite
          of the clause's stated fail-safe intent. R2: the clause names two responses to the power-up
          trigger and a defect can produce one and not the other. A1 and A2 stay true.

# ===================================================================================================
# AMBIGUITIES — as much the deliverable as the enumeration. NOTHING HERE WAS GUESSED INTO AN ASSERTION.
# ===================================================================================================
ambiguities:

  - id: AMB-01
    severity: high
    clause: REQ-HBA-005
    what: >-
      No clause says what happens when FaultReset is asserted while Hopper_Level_High is still true and
      the plant is still running. Does the alarm clear and the persistence window re-arm from zero (so a
      still-blocked hopper takes another full threshold to re-alarm), or does it clear and immediately
      re-raise (the cumulative time already being past threshold)? Both are consistent with every
      sentence in the register, and they are observably different.
    would_settle_it: "An owner ruling on whether FaultReset also re-arms the persistence window."
    not_resolvable_by: "Reading the architecture or the IR. That would make the denominator a reading of the implementation."

  - id: AMB-02
    severity: medium
    clause: REQ-HBA-005
    what: >-
      "Asserting FaultReset" does not say whether the reset is edge-triggered or level-sensitive, nor
      which wins when FaultReset and a fresh alarm trigger coincide in the same scan (reset-dominant vs
      set-dominant). A held-true FaultReset would, on a level-sensitive reset-dominant reading, make the
      alarm unlatchable.
    would_settle_it: "An owner ruling on edge-vs-level and on set/reset dominance."

  - id: AMB-03
    severity: high
    clause: "REQ-HBA-001 A2, REQ-HBA-005 A2, REQ-HBA-007 A3"
    what: >-
      *** THE INHIBIT/STOP DEMAND OUTPUT HAS NO NAME ANYWHERE IN THE REGISTER. *** Q-HBA-05 names
      `HopperBlockedAlarm` and then describes the second output only as "an inhibit/stop demand bit".
      `EnumeratedAssertion.ResponseSignal` is REQUIRED — an empty one raises
      `EnumerationDefect.NoResponseSignal` — so three assertions carry a placeholder and the one
      mechanical half of inflation route 5 (the cited assertion's response signal must appear in the
      vector's Expectations) CANNOT RUN for them.
    consequence: "A vector can cite any of those three and expect on nothing related, in good faith, and no verifier notices."
    would_settle_it: "The register naming the output, or the gate-1 signer publishing the name as a register amendment."

  - id: AMB-04
    severity: high
    clause: REQ-HBA-007
    what: >-
      The clause Text already carries the gate-1 revision (latched alarm SURVIVES the power cycle) while
      the same register's gate-1 question list records NEW-HBA-04 as OPEN, second-confirm pending, "owner
      OK needed". The register contradicts itself about whether a signed REQ has been changed.
    consequence: "If the second-confirm goes the other way, A2 and A3 are reworded, get new IDs, and every citation to them is STALE."
    would_settle_it: "Closing NEW-HBA-04 before any vector is written against REQ-HBA-007."

  - id: AMB-05
    severity: high
    scope: "the enumeration METHOD, not this register"
    clause: REQ-HBA-001
    what: >-
      `assertion-enumeration.md` gives two tie-breaks that disagree here. §1's DEFINITION is existential
      PER ASSERTION ("there exists a defect making A false while every OTHER assertion of C stays true"),
      which is symmetric and rejects splitting NEW-HBA-01's pause-and-resume out of A1. §2.2's stated
      PROCEDURE is one-sided ("name the defect that breaks this half and not the other; if you cannot,
      it is one assertion"), which admits the split. §1 was followed, giving 3 assertions for
      REQ-HBA-001 and a denominator of 13; §2.2 gives 4 and 14.
    consequence: >-
      Under the reading taken, NO assertion isolates the reset-on-stop defect. A vector citing
      REQ-HBA-001 A1 with an uninterrupted run covers A1 without ever exercising pause-and-resume. That
      is inflation route 5 and it is judgement, not mechanism.
    would_settle_it: >-
      A ruling on which tie-break governs. If §2.2 does, adopt the candidate assertion recorded under
      REQ-HBA-001 verbatim (its text is written out there, so the re-decomposition costs one hash).

  - id: AMB-06
    severity: medium
    clause: "REQ-HBA-001, REQ-HBA-002, REQ-HBA-003, REQ-HBA-007"
    what: >-
      Q-HBA-01 fixes the threshold at 60 s and NEW-HBA-03 the debounce at T#2S, but both are called
      commissioning-changeable tunables. The numbers were kept OUT of the hashed assertion text (carried
      in `bound:` instead), because baking a commissioning-tunable value into the identity would dangle
      every citation on every retune — which is the opposite of what §3.2's stability property is for.
    would_settle_it: >-
      Confirmation that the assertion's identity should be stable across a retune. If the value belongs
      in the text instead, six assertions get new IDs and this file must be reissued BEFORE any vector
      cites it.

  - id: AMB-07
    severity: high
    clause: "REQ-HBA-003 vs NEW-HBA-01 / Q-HBA-04"
    what: >-
      *** TWO OWNER RULINGS COLLIDE AND THE REGISTER NEVER RECONCILES THEM. *** NEW-HBA-01 says losing
      the running feedback FREEZES the accumulated persistence time and resumes from there. REQ-HBA-003
      + Q-HBA-02 say a debounced clear of Hopper_Level_High DISCARDS it. What happens when both hold —
      the plant is stopped (accumulation frozen) and the hopper then clears for longer than the filter
      time while stopped? Discarded, or preserved by the freeze? The register determines neither, and
      the two behaviours are observably different on the very next run.
    consequence: "This is the one I would chase first. It is a behavioural hole, not a wording one, and it sits on the most likely real plant sequence."
    would_settle_it: "An owner ruling on whether a qualified clear discards the window while the plant is not running."

  - id: AMB-08
    severity: low
    clause: REQ-HBA-002
    what: >-
      REQ-HBA-002 says "clears (goes false)"; Q-HBA-02 rules that a brief false is not a clear. Read
      literally they contradict. The debounced reading was taken (it is the later, owner-resolved one)
      and is recorded on the assertion as `reading_taken`.
    would_settle_it: "Confirmation, or an edit to REQ-HBA-002's text. If the literal reading was meant, REQ-HBA-002 A1 is reworded and re-hashed."

# ===================================================================================================
# THE GATE'S PROJECTION — `SubmissionDocument.Enumeration`.
# Emit `forms` and `enumerator`; without them gates 3e (assertion-form authority) and 3d (enumerator
# independence) report NOT CHECKED, which is not a pass. CANNOT BE FILLED IN UNTIL THE IDs ARE COMPUTED.
# ===================================================================================================
gate_projection_template:
  clauses: [REQ-HBA-001, REQ-HBA-002, REQ-HBA-003, REQ-HBA-004, REQ-HBA-005, REQ-HBA-006, REQ-HBA-007]
  assertions: "<13 computed IDs>"
  forms:
    # id -> form. Ordinals shown here are DISPLAY ONLY and are NEVER citable.
    REQ-HBA-001.A1: When
    REQ-HBA-001.A2: When
    REQ-HBA-001.A3: When
    REQ-HBA-002.A1: When
    REQ-HBA-003.A1: When
    REQ-HBA-003.A2: When
    REQ-HBA-004.A1: Never
    REQ-HBA-005.A1: When
    REQ-HBA-005.A2: When
    REQ-HBA-006.A1: When
    REQ-HBA-007.A1: When
    REQ-HBA-007.A2: When
    REQ-HBA-007.A3: When
  enumerator: assertion-enumerator

# ===================================================================================================
# NOT MINE TO ASSIGN
# ===================================================================================================
buckets_not_assigned_here: >-
  OUT-OF-SCOPE and UNTESTABLE-ON-RIG belong to whoever signs off the architecture at gate 1 (§4.3) —
  never to the block's author, never to a vector's author, and not to the enumerator either. DEFERRED
  needs an owner and a date. UNCLASSIFIED is never written: it is
  enumerated - (COVERED u OUT-OF-SCOPE u DEFERRED u UNTESTABLE-ON-RIG), computed across two artifacts.
