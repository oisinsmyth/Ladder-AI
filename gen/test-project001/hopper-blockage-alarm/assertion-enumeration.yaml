  scope: "class-level for every clause (`instances: []`)"
  rationale: >-
    No clause text names a set. Scope is "this one FB only"; the tag grounding declares one hopper level
    input and one operator reset; Q-HBA-04 names one shredder run-feedback pair. There is no
    "each of the N hoppers" anywhere in the register. Unchanged at issue 2 — none of AR-HBA-01…06 touches
    the instance axis.
  standing_condition: >-
    *** IF THIS FB IS EVER PLACED MORE THAN ONCE, THIS DECLARATION IS WRONG AND MUST BE RE-DECLARED BY AN
    ENUMERATOR — a re-decomposition event, not something a citation fixes. *** A citation naming an
    undeclared instance is a FINDING (§4/R4), never a new unit.

denominator:
  clauses: 7
  assertions: 19
  coverage_units: 19          # assertions x declared instances

bounds:
