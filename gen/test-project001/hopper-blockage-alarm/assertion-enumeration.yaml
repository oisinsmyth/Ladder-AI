# ===================================================================================================
# AMBIGUITIES
# ===================================================================================================
ambiguities_closed_since_issue_4:
  the_vector_authors_dispute: "CLOSED by AR-HBA-13 — limb 1 restored. Produced 002.A3 and 008.A3."

ambiguities_open:

  - id: AMB-14
    severity: medium
    status: "OPEN, unchanged, still not blocking — it changes no assertion text."
    what: >-
      `EnumeratedAssertion.ResponseSignal` is a SINGLE string, but REQ-HBA-008 A1/A2 are SIMULTANEITY
      claims needing both signals observed. A vector can cite one, expect on `HopperBlockedInhibit` alone,
      and pass the mechanical check while testing nothing about the relation.
    would_settle_it: "`ResponseSignal` becomes a set (schema change in `Ladder.Wave` / `EnumerationDocument`), or a ruled convention that relational co-signals are the vector reviewer's judgement."
    note: "008.A3 is NOT affected — it is a single-signal claim about the inhibit alone."

  - id: AMB-15
    severity: high
    kind: "NEW — a combination gap between AR-HBA-13's definition of 'uninterrupted' and AR-HBA-10's window."
    clause: "REQ-HBA-002 limb 1 x REQ-HBA-007 / AR-HBA-10"
    what: >-
      Limb 1's precondition is "no debounced clear and no `FaultReset` **since the accumulated persistence
      time was last zero**". AR-HBA-10's sequence is: power cycle ZEROES the accumulator, THEN the operator
      presses `FaultReset`. *** SO THE RESET FALLS AFTER THE ZEROING, AND ON THE NATURAL READING LIMB 1
      DOES NOT BITE INSIDE THAT WINDOW. *** The register's own consistency re-read concluded these
      "reinforce", on the grounds that a power cycle "starts a fresh first episode" — but that conclusion
      needs "since it was last zero" to mean *the most recent instant at which it read zero* (accrual
      start, after the reset) rather than *the zeroing event* (before the reset). The two readings differ
      and the clause does not say which.
    why_it_matters: >-
      Under the "zeroing event" reading, an under-scaled preset is UNCATCHABLE inside the post-power-cycle
      window: 007.A5 is a `WITHIN` bound — an UPPER limit — which a short preset satisfies MORE easily,
      not less, and no assertion supplies a lower bound there. *** THAT IS THE SAME DEFECT CLASS THE
      VECTOR AUTHOR JUST FOUND, SURVIVING IN ONE SCENARIO. ***
    would_settle_it: >-
      One clause in AR-HBA-13: whether the "first episode" restarts at the moment ACCRUAL RESUMES from
      zero (limb 1 bites everywhere, nothing further needed) or at the zeroing EVENT (limb 1 is silent in
      the window, and the enumeration needs one further assertion per output — denominator 29).
    what_i_did: >-
      Took the clause's wording VERBATIM into 002.A3's trigger and recorded the caveat on the assertion.
      Did NOT pick a reading. If the ruling goes the second way, 002.A3's text does not move — two
      assertions are ADDED, so the cost is two UNCLASSIFIED units and no dangled citation.

  - id: AMB-16
    severity: high
    kind: "NEW — the GENERAL form of the hole AR-HBA-13 repaired locally."
    clause: "register-wide"
    what: >-
      AR-HBA-13 states that limb 1's threshold is the **SPECIFIED** one and not the implementation's
      preset — and it is the only place in the register that says so. *** TWENTY-TWO OTHER ASSERTIONS SAY
      "the persistence threshold" OR "a further full persistence threshold" AND THE REGISTER NEVER SAYS
      WHICH THRESHOLD THOSE MEAN. *** The consequences are not symmetric and that is what makes it
      urgent: read as the block's own preset, `003.A1`, `003.A3` and `007.A1` become substantially weaker
      than they look — `003.A1` would otherwise ALSO have caught the under-scaled preset, post-clear.
      Read as the specified value, they all bite as intended and nothing changes.
    why_this_is_the_same_shape: >-
      The hole the vector author found was a claim that READ as covered because its title survived. This
      is a claim that reads as covered because its REFERENCE POINT is assumed. Both are invisible to a
      consistency pass, because in both cases the text is internally consistent — it is just not saying
      what a reader assumes.
    would_settle_it: >-
      *** ONE LINE IN THE FORMAT SECTION, AND IT COSTS ZERO RE-HASHES: "the persistence threshold" and
      "the clear-debounce filter time" ALWAYS mean the SPECIFIED values in AR-HBA-03's table, wherever
      they appear. *** AR-HBA-03 already implies it ("a vector reads it from this table and says which it
      used"); making it explicit closes the question for all 27 assertions at once without moving a single
      sentence. If instead the preset reading is intended anywhere, those assertions must be reworded —
      and after stamping that dangles every citation to them.
    recommended: "Settle this one BEFORE the next stamp. It is the cheapest ruling available and it closes the widest hole."

  - id: AMB-17
    severity: low
    kind: "A METHOD observation, raised rather than adopted."
    what: >-
      This register carried a clause whose TITLE promised a claim its TEXT no longer made, for four
      enumeration rounds, and no consistency pass could have found it — the text was consistent, it was
      simply missing a claim. A cheap mechanical smell test exists: *** A CLAUSE TITLE NONE OF WHOSE
      ASSERTIONS SUPPORTS. *** "No alarm below threshold" against two assertions both conditioned on a
      debounced clear would have flagged.
    what_i_did_NOT_do: >-
      Did not adopt it. An enumerator who derives assertions from TITLES is no longer spec-derived — the
      title is a label, not a claim, and inventing from it is how a denominator starts including things
      nobody specified. Offered as a REPORTED SIGNAL alongside the assertions-per-clause ratio, never as a
      source of assertions.
    would_settle_it: "A ruling on whether `enumerate-assertions` should report title/assertion mismatch as a signal in the same way it reports the per-clause ratio."

