  - "A power cycle mid-debounce is covered: REQ-HBA-007 Notes name the debounce itself as non-retentive, so the filter restarts. No gap, no assertion needed."
  - "REQ-HBA-004's NEVER survives AR-HBA-10 unchanged — a power cycle is not a de-assert, and the post-power-cycle clear is on a FaultReset edge, which is the exception it carves out."
  - "REQ-HBA-006 survives AR-HBA-06 unchanged — a debounced clear drops the ACCUMULATOR, not the LATCH."
  - "No first-raise / re-raise asymmetry: the accumulator can only reach the threshold while running, so REQ-HBA-001 A1's running-qualified trigger and REQ-HBA-005 A6's ungated re-raise do not conflict."
  - "The bounds table and the signal-name property hold after AR-HBA-07…10: no ruling put a number or a signal name into any hashed sentence, so the zero-re-hash property survives another round."

