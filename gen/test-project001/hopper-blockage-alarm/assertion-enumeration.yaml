  # assertion text. Retuning either changes NOTHING here and re-hashes NOTHING.
  persistence_threshold:      "T#60S  (Q-HBA-01, owner)"
  clear_debounce_filter_time: "T#2S   (NEW-HBA-03, owner)"

clauses:

  # =================================================================================================
  REQ-HBA-001:
    title: Continuous-high blockage alarm
    instances: []
    refined_by:
      - "Q-HBA-01 / AR-HBA-03: threshold carried as a bound, not as text"
      - "Q-HBA-04: accumulates only while running (Shredder_Run_Fwd_FB OR Shredder_Run_Rev_FB)"
      - "Q-HBA-05 + AR-HBA-01: two outputs — HopperBlockedAlarm and HopperBlockedInhibit"
      - "NEW-HBA-01: pause-and-resume; 'continuously high' becomes 'cumulatively high-and-running'"
      - "AR-HBA-06: the freeze applies only while the hopper still reads high"
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the hopper-blockage alarm is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the hopper-blockage alarm is asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The alarm output is never asserted, or is asserted from a condition other than the elapsed
          persistence window, while the inhibit output still asserts correctly at the same trigger.
          A2, A3 and A4 stay true — Q-HBA-05 makes these two independent FB outputs.
        text_changed_from: "WHEN Hopper_Level_High has been continuously true while the plant is running for a cumulative time exceeding the persistence threshold THEN the hopper-blockage alarm is asserted"
        why_reworded: >-
          NARROWED TO THE UNINTERRUPTED RUN so that A1 and A4 are DISJOINT scenarios rather than nested.
          §2.2-as-corrected calls this "the uninterrupted-run assertion" in its worked example. Disjoint
          matters: while A4 was inside A1's trigger, one vector exercising an uninterrupted run covered
          both, which is how the reset-on-stop defect was absorbed in the first place.

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the inhibit/stop demand output is asserted"
        normalised_text: "WHEN Hopper_Level_High has been continuously true and the plant has run continuously for the persistence threshold time THEN the inhibit/stop demand output is asserted"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output is left unwritten, or is driven from a different condition, while the alarm
          output asserts correctly. R2 — one trigger, two responses, and a defect can produce one and
          not the other. A1, A3 and A4 stay true.
        text_changed_from: "WHEN Hopper_Level_High has been continuously true while the plant is running for a cumulative time exceeding the persistence threshold THEN the inhibit/stop demand output is asserted"
        why_reworded: "Mirrors A1's narrowing, so the pair keeps sharing one trigger."

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true THEN the hopper-blockage alarm is not asserted"
        normalised_text: "WHEN Hopper_Level_High is continuously true for longer than the persistence threshold while neither Shredder_Run_Fwd_FB nor Shredder_Run_Rev_FB is true THEN the hopper-blockage alarm is not asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The run-state gate is absent, so persistence time accrues at standstill and a full hopper alarms
          with the plant stopped — Q-HBA-04's own worked case. A1, A2 and A4 stay true: the running case
          still behaves.
        rule: "R1 — the trigger's NEGATIVE case."
        text_unchanged_since_issue: 1

      - ordinal: A4
        form: When
        text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        normalised_text: "WHEN the plant's running feedback is lost part-way through the persistence window and later returns with Hopper_Level_High still continuously true THEN the hopper-blockage alarm is asserted once the cumulative high-and-running time reaches the persistence threshold"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE RESET-ON-STOP DEFECT. *** The elapsed persistence time is DISCARDED on loss of running
          rather than FROZEN (NEW-HBA-01 rules pause-and-resume), so an interrupted run never reaches the
          threshold and a genuinely blocked hopper never alarms. A1 stays true — the uninterrupted run
          still alarms correctly — which is exactly §1's test passing.
        new_in_issue: 2
        provenance: >-
          Recorded at issue 1 as `candidate_assertion_NOT_enumerated`, adopted VERBATIM here. AMB-05 is
          ruled: §1 governs, the falsifiability test runs once per CANDIDATE not once per PAIR, and a
          split is required as soon as ANY candidate has its own isolating defect
          (`assertion-enumeration.md` §2.2, corrected 2026-08-13 with this very case as its worked example).
        not_split_further: >-
          No paired inhibit-output assertion for this trigger. R2 would suggest one, but the only defect
          that would break the inhibit in the INTERRUPTED case while leaving it correct in the
          uninterrupted case is describable solely in terms of how the two outputs are computed — R5
          forbids that split. A2 already carries the claim that the inhibit follows the same trigger.

  # =================================================================================================
  REQ-HBA-002:
    title: No alarm below threshold
    instances: []
    amended_by: "AR-HBA-04 — reworded to the debounced reading; the literal contradiction with Q-HBA-02 is gone (closes AMB-08)"
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false and stays continuously false for at least the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is not raised for that high episode"
        normalised_text: "WHEN Hopper_Level_High goes false and stays continuously false for at least the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is not raised for that high episode"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The clear is not honoured at all — the accumulator ignores hopper-low entirely — so an episode
          that visibly cleared still alarms. A2 stays true: a sub-filter-time false indeed fails to
          prevent the alarm, which is what A2 claims.
        text_changed_from: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time before the persistence threshold has elapsed THEN the hopper-blockage alarm is not asserted for that high episode"
        why_reworded: >-
          Tracks AR-HBA-04's amended clause text: "stays continuously false" (not merely a false lasting
          that long) and "the ACCUMULATED persistence time reaches the threshold" (NEW-HBA-01's
          accumulator, not a wall-clock window). Issue 1's `reading_taken:` note is retired — the reading
          is now IN the clause, so it no longer needs to be flagged as an enumerator's interpretation.

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is still raised for that high episode"
        normalised_text: "WHEN Hopper_Level_High reads false for less than the clear-debounce filter time before the accumulated persistence time reaches the threshold THEN the hopper-blockage alarm is still raised for that high episode"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The clear debounce is absent, so any glitch to false counts as a clear and prevents the alarm —
          a genuinely blocked hopper with a chattering sensor never alarms. A1 stays true: a long clear
          still correctly prevents it.
        new_in_issue: 2
        provenance: "AR-HBA-04's SECOND sentence, which did not exist at issue 1: 'A false reading shorter than the filter time is not a clear and does not, by itself, prevent the alarm.'"
        cross_clause_note: >-
          Close in content to REQ-HBA-003 A2 — A2 here is about the alarm still being RAISED for this
          episode, REQ-HBA-003 A2 about WHEN it is raised (the accumulator not having been discarded).
          §1's test is scoped WITHIN a clause, so both stand; recorded so the overlap is visible rather
          than discovered by a reviewer.

  # =================================================================================================
  REQ-HBA-003:
    title: Momentary clear re-arms the window
    instances: []
    amended_by: "AR-HBA-06 — a debounced clear discards the accumulator WHETHER OR NOT the plant is running; the discard beats the freeze (closes AMB-07)"
    note_on_form: >-
      As written this clause asserts an INTERNAL STATE TRANSITION ("discards the accumulated persistence
      time"), which is not an observable response and fits neither canonical form. All three assertions
      restate it as the alarm's subsequent TIMING, its only observable consequence. That restatement is a
      judgement a second enumerator could make differently.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is running and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulator is NOT discarded on a qualified clear, so it carries over and a later brief high
          trips the alarm early. A2 stays true (a glitch still discards nothing) and A3 stays true.
        text_changed_from: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        why_reworded: "Narrowed to the plant-RUNNING case so that A1 and A3 are disjoint. AR-HBA-06 made the stopped case a separate, separately-breakable claim."

      - ordinal: A2
        form: When
        text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for less than the clear-debounce filter time and then returns true THEN the hopper-blockage alarm is asserted once the persistence threshold measured from before the brief clear has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The clear debounce is absent, so a single-scan glitch discards the accumulator and a genuinely
          blocked hopper never alarms — Q-HBA-02's stated failure. A1 and A3 stay true: a qualified clear
          still correctly discards.
        rule: "R1 — Q-HBA-02 creates a second, opposite-signed trigger."
        text_unchanged_since_issue: 1

      - ordinal: A3
        form: When
        text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is stopped and the plant then restarts with the hopper high THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        normalised_text: "WHEN Hopper_Level_High goes false for at least the clear-debounce filter time while the plant is stopped and the plant then restarts with the hopper high THEN the hopper-blockage alarm is not asserted until a further full persistence threshold of high-and-running time has accumulated"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          *** THE DEFECT AR-HBA-06 WAS WRITTEN TO PREVENT. *** The discard is gated on the run state, so
          the running-loss FREEZE preserves a stale, nearly-elapsed accumulator across a stop during which
          the hopper visibly emptied — and the next brief high alarms almost at once on a hopper that is
          not blocked. AR-HBA-06's worked case: 40 s of 60 s accumulated, plant stops, hopper clears for
          2 s; correct behaviour discards to 0 s, the defect alarms after a further 20 s. A1 and A2 stay
          true — the running case still discards correctly.
        new_in_issue: 2
        provenance: "AR-HBA-06, which did not exist at issue 1. This was AMB-07, raised as 'the one I would chase first'."

  # =================================================================================================
  REQ-HBA-004:
    title: Alarm latches until reset
    instances: []
    assertions:

      - ordinal: A1
        form: Never
        text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        normalised_text: "NEVER the hopper-blockage alarm de-asserts unless FaultReset has been asserted since the alarm was raised"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: a prohibition with no natural trigger (the
          NEVER form's stated purpose), naming one output. Its own defect is a MOMENTARY alarm — the
          output pulses or self-clears on a timer with Hopper_Level_High still true — which the clause's
          Notes call out directly ("level-persistent, not a momentary pulse").
        text_unchanged_since_issue: 1
        checked_against_AR_HBA_05: >-
          Deliberately NOT tightened to "a rising edge of FaultReset". The edge-versus-level defect is
          isolated by REQ-HBA-005 A4; tightening this text would re-hash it to catch a defect another
          assertion already catches, and would make the two overlap.
        cross_clause_note: >-
          REQ-HBA-006's assertion is a strict SUB-CASE of this one. §1's test is clause-scoped, so both
          stand. A defect isolating this from REQ-HBA-006 exists (a self-clearing pulse with the hopper
          still high); the converse does not.

  # =================================================================================================
  REQ-HBA-005:
    title: Reset clears the alarm
    instances: []
    amended_by: "AR-HBA-05 — rising edge, raise-dominant, accumulator untouched, clear-then-re-evaluate (closes AMB-01 and AMB-02)"
    note: >-
      The largest change in this re-issue: 2 assertions at issue 1, 5 here. AR-HBA-05 added three
      behavioural rulings to what had been a single sentence, and each is separately breakable. Issue 1's
      note that the inhibit-clears-on-reset assertion was DERIVED from REQ-HBA-007's wording is retired —
      it is now stated in this clause's own Text.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is de-asserted"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the hopper-blockage alarm is de-asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset path does not reach the alarm output — the latch is unresettable, or the reset is
          consumed elsewhere — while the inhibit output does clear. A2…A5 stay true.
        text_changed_from: "WHEN FaultReset is asserted while the hopper-blockage alarm is latched THEN the hopper-blockage alarm is de-asserted"
        why_reworded: >-
          AR-HBA-05 makes the reset an EDGE, and makes the clear conditional: with the blockage condition
          still true the alarm re-raises, so "is de-asserted" is only a stable, observable outcome once
          the accumulated time is back below threshold. Issue 1's text would have been FALSE under the
          ruling for the still-blocked case.

      - ordinal: A2
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is de-asserted"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is below the threshold THEN the inhibit/stop demand output is de-asserted"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output is left asserted after the reset while the alarm clears — a stale stop demand
          with the annunciation already gone, which no operator action can then clear. R2: two independent
          FB outputs. A1 and A3…A5 stay true.
        text_changed_from: "WHEN FaultReset is asserted while the hopper-blockage alarm is latched THEN the inhibit/stop demand output is de-asserted"
        why_reworded: "Mirrors A1. Also no longer a cross-clause derivation — AR-HBA-05 puts 'and, with it, the inhibit/stop demand' in this clause's own Text."

      - ordinal: A3
        form: When
        text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is asserted again"
        normalised_text: "WHEN a rising edge of FaultReset occurs while the hopper-blockage alarm is latched and the accumulated persistence time is still at or past the threshold THEN the hopper-blockage alarm is asserted again"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset ZEROES the accumulator (AR-HBA-05 rules it untouched), so an operator acknowledging a
          hopper that is still blocked buys a guaranteed quiet threshold's-worth of time — the
          re-arm-from-zero behaviour the ruling rejects, arriving by a side door. A1, A2, A4 and A5 stay
          true. This is the observable consequence of "the accumulator is untouched by reset", which is
          internal state and cannot be asserted directly.
        new_in_issue: 2
        provenance: "AR-HBA-05, ruling AMB-01. The register states the testable consequence explicitly."

      - ordinal: A4
        form: Never
        text: "NEVER the hopper-blockage alarm is held de-asserted by a continuously-true FaultReset while the accumulated persistence time is at or past the threshold"
        normalised_text: "NEVER the hopper-blockage alarm is held de-asserted by a continuously-true FaultReset while the accumulated persistence time is at or past the threshold"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The reset is LEVEL-sensitive rather than edge-triggered, so a stuck-on or wired-on FaultReset
          pins the alarm off permanently and silently — the failure AR-HBA-05's edge ruling names. A1…A3
          and A5 stay true: a PULSE still behaves correctly in every one of them, which is exactly why a
          level defect survives all of them undetected.
        new_in_issue: 2
        provenance: "AR-HBA-05's edge-not-level ruling, plus the clause's own 'holding FaultReset on continuously cannot pin the alarm off'."

      - ordinal: A5
        form: When
        text: "WHEN a rising edge of FaultReset and a satisfied raise condition occur in the same evaluation THEN the hopper-blockage alarm is asserted at the end of that evaluation"
        normalised_text: "WHEN a rising edge of FaultReset and a satisfied raise condition occur in the same evaluation THEN the hopper-blockage alarm is asserted at the end of that evaluation"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The coincident case resolves reset-dominant rather than raise-dominant, so the alarm ends that
          evaluation clear. A1…A4 stay true: under reset-dominance the alarm still re-raises on the NEXT
          evaluation, so A3 is unharmed, and the edge behaviour A4 tests is untouched.
        new_in_issue: 2
        provenance: "AR-HBA-05's raise-dominant ruling."
        observability_caveat: >-
          NOT an ambiguity in the requirement — a warning for whoever cites it. This assertion is about a
          SINGLE-EVALUATION outcome, so it may need `Stamped` instrumentation rather than `Sampled`; a
          sampled observation cannot distinguish it from A3. That is the vector's observability
          declaration to make and the runner's to refuse, not the enumeration's to soften.

  # =================================================================================================
  REQ-HBA-006:
    title: Hopper clearing while alarm latched does not clear it
    instances: []
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        normalised_text: "WHEN Hopper_Level_High returns false while the hopper-blockage alarm is latched and FaultReset is not asserted THEN the hopper-blockage alarm remains asserted"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          Sole assertion of the clause. NOT split further: one trigger, one response, and the inhibit
          output is not mentioned for this case. Its own defect is the alarm FOLLOWING the level rather
          than latching — the clause's own stated concern ("not a live level-follow of the sensor").
        text_unchanged_since_issue: 1

  # =================================================================================================
  REQ-HBA-007:
    title: Power-up / first-scan state
    instances: []
    startup: true     # §4.2's SCHEDULING ATTRIBUTE, orthogonal to the bucket — a routing tag, not a fifth
                      # bucket. §7's own wording reads as a bucket and remains UNCONFIRMED (§7 open item 1).
    closed_by: "AR-HBA-02 — NEW-HBA-04 closed as already applied; this clause's Text is UNCHANGED by that closure (closes AMB-04)"
    note_on_form: >-
      "the transient persistence state starts fresh" is internal state, not an observable response. A1
      restates it as the alarm's observable timing after a power cycle.
    assertions:

      - ordinal: A1
        form: When
        text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        normalised_text: "WHEN the PLC powers up with no hopper-blockage alarm latched THEN a hopper-blockage alarm requires a full persistence threshold of high-and-running time accumulated after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The accumulated persistence time survives the power cycle, so a PLC restarted part-way through a
          window alarms early — at the extreme, on the first scan. A2 and A3 stay true: the latch still
          survives, which is a different retention decision on a different item.
        text_unchanged_since_issue: 1

      - ordinal: A2
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the hopper-blockage alarm is asserted after power-up"
        response_signal: HopperBlockedAlarm
        split_defect: >-
          The alarm latch does not survive the power cycle, so a live blockage is silently de-annunciated
          by a restart and the operator acknowledgement the clause requires never happens. A1 and A3 stay
          true.
        text_unchanged_since_issue: 1

      - ordinal: A3
        form: When
        text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        normalised_text: "WHEN the PLC powers up with the hopper-blockage alarm latched from before the power cycle THEN the inhibit/stop demand output is asserted after power-up"
        response_signal: HopperBlockedInhibit
        split_defect: >-
          The inhibit output does not survive the power cycle while the alarm does, so the plant is
          released to run after a restart with the blockage alarm still annunciated — the opposite of the
          clause's stated fail-safe intent. R2: two responses to the power-up trigger, one breakable
          without the other. A1 and A2 stay true.
        text_unchanged_since_issue: 1

