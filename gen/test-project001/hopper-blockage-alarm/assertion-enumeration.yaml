  AMB-13: "CLOSED by AR-HBA-12 — REQ-HBA-008, general rather than case-specific. Produced 008.A1/A2."

ambiguities_open:

  - id: AMB-14
    severity: medium
    kind: "A LIMIT IN THE ENUMERATION FORMAT, not a defect in this register."
    subject: "REQ-HBA-008 A1 and A2 — the first RELATIONAL assertions in the corpus"
    what: >-
      `EnumeratedAssertion.ResponseSignal` is a SINGLE string, and the mechanical check that partly closes
      inflation route 5 is "the cited assertion's response signal appears in the vector's `Expectations`".
      *** A SIMULTANEITY CLAIM HAS TWO SIGNALS AND BOTH MUST BE OBSERVED FOR THE CITATION TO MEAN
      ANYTHING. *** As things stand a vector can cite 008.A1, expect on `HopperBlockedInhibit` alone,
      never observe `HopperBlockedAlarm` at all, and the check passes — while testing nothing about the
      relation the assertion is entirely about. Recorded on both assertions as `also_requires_observation_of:`,
      which the wire format cannot carry.
    why_it_appeared_now: >-
      Every assertion in issues 1-3 was about ONE signal. REQ-HBA-008 is the register's first claim about
      a RELATION BETWEEN TWO, so this is the first time the single-string field has been insufficient. It
      is the same shape as AMB-03 — a check that cannot run — but structural rather than a naming gap.
    would_settle_it: >-
      Either `ResponseSignal` becomes a set (a schema change in `Ladder.Wave` and in
      `EnumerationDocument`, not a register change), or a convention is ruled that a relational assertion's
      co-signals are declared elsewhere and checked by the vector reviewer as judgement.
    *** DOES NOT BLOCK STAMPING ***: >-
      It changes NO assertion text. Both readings above are satisfied by the texts exactly as written, so
      settling it after the stamp dangles nothing. That is the reason it is safe to freeze with this open.

