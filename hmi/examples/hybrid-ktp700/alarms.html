<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ALARMS - Line 3 Screening Plant - KTP700 Basic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hdr"               data-hmi="Rectangle"></div>
  <div class="hdr-title txt"     data-hmi="Text">ALARMS</div>
  <div class="hdr-clock txt num" data-hmi="Text">SCREEN 2 OF 5</div>

  <div class="txt" style="left:10px; top:52px; width:780px;" data-hmi="Text">Active alarm list, alarm history and acknowledge controls.</div>
  <div class="dim" style="left:10px; top:78px; width:780px;" data-hmi="Text">Acknowledge is on the alarm view's own toolbar, not on a separate button.</div>

  <div class="rule" style="top:108px;" data-hmi="Line"></div>

  <div class="alarm" style="top:120px; height:250px;" data-hmi="AlarmPlaceholder">ALARM VIEW GOES HERE - add manually</div>

  <div class="rule" style="top:382px;" data-hmi="Line"></div>

  <button class="back" data-hmi="Button">HOME</button>

  <div class="dim num" style="left:170px; top:420px; width:400px;" data-hmi="Text">SCREEN ID 1002 - REV 00 - PLACEHOLDER</div>

</body>
</html>
