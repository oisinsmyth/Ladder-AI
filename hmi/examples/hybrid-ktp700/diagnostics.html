<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DIAGNOSTICS - Line 3 Screening Plant - KTP700 Basic</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="hdr"               data-hmi="Rectangle"></div>
  <div class="hdr-title txt"     data-hmi="Text">DIAGNOSTICS</div>
  <div class="hdr-clock txt num" data-hmi="Text">SCREEN 5 OF 5</div>

  <div class="txt" style="left:10px; top:52px; width:780px;" data-hmi="Text">Controller state, network health and IO module status.</div>
  <div class="dim" style="left:10px; top:78px; width:780px;" data-hmi="Text">Diagnostic detail is not populated on this screen.</div>

  <div class="rule" style="top:108px;" data-hmi="Line"></div>

  <div class="pane" style="top:120px; height:250px;" data-hmi="Rectangle"></div>
  <div class="txt"  style="left:24px; top:136px; width:740px;" data-hmi="Text">DIAGNOSTIC AREA - reserved</div>
  <div class="dim"  style="left:24px; top:164px; width:740px;" data-hmi="Text">CPU state, rack and IO status come from system tags added here.</div>

  <div class="rule" style="top:382px;" data-hmi="Line"></div>

  <button class="back" data-hmi="Button">HOME</button>

  <div class="dim num" style="left:170px; top:420px; width:400px;" data-hmi="Text">SCREEN ID 1005 - REV 00 - PLACEHOLDER</div>

</body>
</html>
